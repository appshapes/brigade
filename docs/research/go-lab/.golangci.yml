version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(ln|f)?$
          msg: stdout carries protocol output only; use the result printer
        - pattern: ^os\.Exit$
          msg: return an exit status from run(); only main may exit
    gosec:
      excludes:
        - G204 # subprocess launched with a variable: the adapter command is configuration by design
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      - cobraprobe

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/appshapes/brigade
