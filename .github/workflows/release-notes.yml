# Write a published release's notes from the repository's own record, gate them, and tell members to update.
#
# Four stages, in the job `notes`: a writer agent DRAFTS the notes to a file outside the checkout; a deterministic lint
# (scripts/ci/release-notes-lint.sh) refuses anything that does not exist — a skill, a CLI command, an asset — or
# that is placeholder, "Unreleased" or secret-shaped, and holds the notes to the changelog's "who must act" lines;
# a reviewer agent reads the draft against CHANGELOG.md, the
# tag's log and the plugin tree and answers APPROVED or CHANGES_REQUESTED with findings; the writer gets exactly
# one fix cycle; and only an APPROVED, lint-clean draft is published. The publish and the announcement issue are
# shell steps of a second job, `publish`, not the agent: the two writes are deterministic and idempotent UNDER SERIALISATION -- a re-dispatch
# minutes later rewrites the same notes and opens no second issue. Two SIMULTANEOUS runs were another matter:
# release.yml's duplicated tag push for v0.6.1 (its header) dispatched this workflow twice in one second, runs
# 34779894653 and 34779894742, both reached "Announce, once" a second apart, and both opened the issue (#10 and
# #11, byte-identical; #11 closed by hand) because the guard of the day, `gh issue list --search "… in:title"`,
# is backed by the search index, which had not seen an issue created one second earlier. Now the `concurrency`
# group below serialises the runs of one tag and the guard lists the bot's issues through the issues endpoint,
# never the search index. Why the shell and not the agent: the v0.5.0 notes, written by one agent straight onto
# the release page, named a `/brigade:sessions` skill that did not exist (P9-8, 2026-09-10; it was written later,
# and does now).
#
# How it is reached. release.yml's last step dispatches this workflow after the publish (`workflow_dispatch`,
# actor `github-actions` — one of the two events the job token may raise, and the one event path from a tag push
# that claude-code-action accepts: a `workflow_call` from release.yml ran the action under the tag `push` and it
# refused, run 34537045037; the `release: published` trigger never fires from a `github.token` publish). It can
# also be run by hand: `gh workflow run release-notes.yml -f tag=v0.5.1`.
#
# The second review is BOUNDED to the first review's findings and to the lines the fix changed (the first draft
# is kept as notes-round1.md and the reviewer diffs the two), because the fix cycle is the last: a finding first
# raised after it cannot be fixed, only refuse the notes. The v0.34.0 notes were refused twice that way on
# 2026-10-17 -- runs 39056525211 and 39057612358, each with three findings fixed and different ones raised in
# round 2 -- and published on the third dispatch; the release-notes email was refused the same way twice
# (send-release-notes.yml's header), which is where the bound was first put and verified. What the second
# reviewer notices outside its bound goes after a `NOTES` line in review.md, for the people who read the artifact.
#
# The order of the notes is said ONCE, in the job's NOTES_ORDER, and each of the four prompts carries it by
# `${{ env.NOTES_ORDER }}` (work item 418; scripts/ci/release_notes_lint_test.go holds that all four do). Since
# work item 396 a changelog section opens with who must act, a line each for a Team Member, a Team Admin and a
# Project Owner, and the notes carry those lines right after their first. Said to the writer alone that is worse
# than nothing: the reviewer's own rule was "a USER of the plugin first", which lines for an administrator and an
# owner break, and a reviewer told to assume every claim wrong asks for them to be moved; the fixer and the second
# reviewer each had their own list of the rules, which did not name the lines; and the one fix cycle cannot settle
# an order two prompts disagree on, so no notes are published. With one text there is no second opinion to hold,
# and whether the lines are there and right is the lint's finding alone: it compares them with the changelog word
# for word, which no reviewer has to. Change the order in NOTES_ORDER, and the lint with it when the lines move.
#
# Two jobs, and what each can reach is the design (work item 438, 2026-11-24, ADR 0033; the three scheduled jobs
# have had this shape since ADR 0032):
#
#   notes    the four agent steps, the lint and the gate. Nothing in this job can write to the repository: its
#            token is `contents: read`, and each agent step is handed THAT token (`github_token`), so the action
#            mints none of its own. Until this work item the workflow was one job with `contents: write`,
#            `issues: write` and `id-token: write`, no step was handed a token, and each agent held a token of
#            the Claude GitHub App in its place: contents, pull requests and issues at write on this repository
#            (measured, run 45476572377), which no `permissions:` block bounded. The draft, the lint's result
#            and the review leave the job as an artifact.
#   publish  no agent. Runs only when `notes` ended green, which is the gate's word. Takes the artifact and
#            makes the two writes with its own token, `contents: write` for `gh release edit` and
#            `issues: write` for the announcement. It reads the notes as text and runs nothing an agent wrote.
#
# A dry run (`-f dry_run=true`) goes all the way to `publish`, which then takes the artifact, says what it
# would publish and writes nothing: no notes change and no issue is opened or closed. It is how a change to
# this workflow is tried on a release that is already published:
#
#   gh workflow run release-notes.yml -f tag=v0.60.0 -f dry_run=true
#
# The agents write their files with `tee` from the Bash tool, under a `Bash(tee <path>:*)` prefix rule: the first
# gated run (34541118273) showed the action honouring every Bash rule and none of the `Write(//tmp/…)` rules —
# two denials per agent, no file, and nothing published (the gate held). Each agent step's execution log is
# copied into the artifact, so the next failure is readable from the run page.
name: release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to write notes for, e.g. v0.5.1
        required: true
        type: string
      dry_run:
        description: "true: the notes are drafted, linted and reviewed, and nothing is published or announced."
        required: false
        type: boolean
        default: false

# One run per tag at a time, queued, never cancelled. Two dispatches for v0.6.1 arrived in the same second (runs
# 34779894653 and 34779894742) and reached "Announce, once" one second apart -- no guard, search-backed or not,
# can see an issue the other run is creating at that moment; only serialisation can. Queued rather than
# cancelled because the gate's writes are idempotent -- the second run rewrites the same notes and finds the
# issue -- while a cancelled run would strand nothing but would leave a red run on the tag.
concurrency:
  group: release-notes-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  notes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30         # not a p90: two bounded agent sessions, at most four, plus a build
    permissions:
      contents: read            # the boundary: nothing in this job, agent or shell, can write to the repository
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NOTES_DIR: /tmp/brigade-notes
      # The order of the notes, said once for the four agent steps (the header). The words in backticks after
      # "may read" are the lint's `pointer`, letter for letter.
      NOTES_ORDER: |
        1. The first line: one sentence saying what the release is, with the version number, whole on ONE
           line, then a blank line.
        2. Who must act, ONLY when the section of `CHANGELOG.md` for this version opens with the line
           `**Who must act**`: that line, a blank line, and the section's three bullets after it,
           `- **Team Member:**`, `- **Team Admin:**` and `- **Project Owner:**`, in that order and in the
           changelog's own words, nothing left out and nothing added. Each bullet is ONE line: the changelog wraps
           them, and a release page shows a newline as a line break. One change is allowed in a bullet: where it
           points to an entry of the changelog as `below`, the word `below` may read
           `in [the changelog](https://github.com/appshapes/brigade/blob/master/CHANGELOG.md)`, because the
           notes need not keep that entry under its title. Nothing stands between the first line and these
           lines but the blank line, and a blank line follows the last bullet. They are for a Team Admin and a Project Owner as well as for a user, and they come before
           everything else on purpose. Whether they are there, in their place and in the changelog's words is
           the lint's finding and nobody else's: the lint compares them with the changelog word for word and
           prints, each after `want: `, the four lines it wants. A section that does not open with
           `**Who must act**` gets no such lines: never compose them.
        3. What changed for a USER of the plugin.
        4. Anything an ADAPTER AUTHOR must know.
        5. The assets and their checksums file, every one of them by name.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the agents read `git log <previous tag>..<tag>`; a shallow clone has no tags
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}

      # The two lists the lint needs, from the truth itself: the CLI's own `--help` of a fresh build (never a
      # hand-kept list), and the assets that actually shipped. The plugin's skills the lint reads from the tree.
      - name: Prepare the draft directory and the lint's lists
        run: |
          mkdir -p "$NOTES_DIR"
          go build -o "$NOTES_DIR/brigade" ./cmd/brigade
          commands=$("$NOTES_DIR/brigade" --help | awk '/^Commands:/{f=1;next} /^Global flags:/{f=0} f && /^  [a-z]/{print $1}' | tr '\n' ' ')
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | tr '\n' ' ')
          test -n "$commands" && test -n "$assets"
          { echo "BRIGADE_NOTES_COMMANDS=$commands"; echo "BRIGADE_NOTES_ASSETS=$assets"; } >> "$GITHUB_ENV"
          echo "commands: $commands"; echo "assets: $assets"
        env: {GH_TOKEN: "${{ github.token }}"}

      # ---- round 1 ------------------------------------------------------------------------------------------
      - name: Draft the notes
        id: draft1
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b   # v1 — pinned by SHA: the one action that runs a model
        with:
          github_token: ${{ github.token }}       # the job's read-only token, so the action mints none (the header)
          allowed_bots: "claude,github-actions"   # github-actions is release.yml's dispatch actor (run 34539842793 measured the refusal)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --add-dir: the notes directory is OUTSIDE the checkout, and the Claude Code that claude-code-action
          # v1.0.268 runs (the 2026-11-04 pin) refuses a write outside the session's working directories even when
          # a Bash allow rule names the path — run 41816544619: the drafter's `tee /tmp/brigade-notes/notes.md`
          # was denied twice as "outside the working directories for this session", the reviewer's verdict the
          # same, and nothing was published. Naming the directory as a working directory is what lets the
          # allow rules below apply to it. Every agent step in this file and in send-release-notes.yml carries it.
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 50 --add-dir /tmp/brigade-notes"
          show_full_output: false
          prompt: |
            Release ${{ inputs.tag }} of brigade has been published. DRAFT its release notes — write them to the
            file /tmp/brigade-notes/notes.md and do nothing else. The Write tool is NOT available in this job:
            write the file from the Bash tool with a quoted heredoc, exactly
            `tee /tmp/brigade-notes/notes.md <<'EOF'` … `EOF`. You do not publish: a lint and a reviewer read
            that file after you, and a shell step publishes it if they approve.

            1. Read the section of `CHANGELOG.md` for this version. It is the authority on what changed and why;
               do not restate the commit log over it.
            2. Read `git log --oneline <previous tag>..${{ inputs.tag }}` for anything the changelog omitted, and
               `gh release view ${{ inputs.tag }} --json assets` for the assets that actually shipped.
            3. Compose the notes in the order below, which the reviewer holds them to as well. Keep the
               changelog's own wording where it exists. Never invent a change that is not in the changelog or
               the log.
            4. Name a slash command or a skill ONLY if it exists: list `plugin/skills/` and `plugin/commands/` and
               name only what is there — the listing of the checkout you are drafting for, never a name you
               remember. Name a `brigade <verb>` ONLY if `/tmp/brigade-notes/brigade --help` lists that verb. The
               v0.5.0 notes named a `/brigade:sessions` skill that had not been written yet, and that slip is why
               you are being checked.
            5. Use the version number, never "Unreleased". No placeholders.

            The order of the notes:
            ${{ env.NOTES_ORDER }}

            Do not edit any file in the repository. Do not push. Do not run `gh release edit` or `gh issue create`.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/notes.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }
          # No WebFetch, no WebSearch, no `gh` write verb: the draft is composed from the checkout and the job's
          # own read-only token, and the writes happen in the job `publish`. NO GH_ACTIONS_TOKEN anywhere in this
          # workflow.

      - name: Keep the drafter's execution log
        if: always() && steps.draft1.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/draft1-execution.json" 2>/dev/null || true
      - name: Lint the draft
        id: lint1
        continue-on-error: true   # a failure is a finding for the fix cycle, recorded for the writer to read
        run: scripts/ci/release-notes-lint.sh "$NOTES_DIR/notes.md" "$RELEASE_TAG" | tee "$NOTES_DIR/lint.txt"; exit "${PIPESTATUS[0]}"

      - name: Review the draft
        id: review1
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b   # v1
        with:
          github_token: ${{ github.token }}
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 50 --add-dir /tmp/brigade-notes"
          show_full_output: false
          prompt: |
            You are the reviewer of a DRAFT of the release notes for ${{ inputs.tag }} of brigade, at
            /tmp/brigade-notes/notes.md. Write your verdict to /tmp/brigade-notes/review.md from the Bash tool with
            a quoted heredoc, exactly `tee /tmp/brigade-notes/review.md <<'EOF'` … `EOF` (the Write tool is NOT
            available in this job): the FIRST line is exactly `APPROVED` or `CHANGES_REQUESTED`, then one finding
            per line, each naming the sentence and what is wrong. Do nothing else.

            Check every claim against the sources, assuming each is wrong until you have seen it right:
            - Every change described is in `CHANGELOG.md`'s section for this version or in
              `git log --oneline <previous tag>..${{ inputs.tag }}`; nothing is invented, nothing important
              in the changelog is missing, and the changelog's meaning is not distorted.
            - Every `/brigade:<name>` exists under `plugin/skills/` or `plugin/commands/`; every `brigade <verb>`
              is listed by `/tmp/brigade-notes/brigade --help`.
            - The assets named are exactly `gh release view ${{ inputs.tag }} --json assets`.
            - The notes follow the order below, which is the writer's too; they name the version; they say
              "Unreleased" nowhere; there is no placeholder.
            - If /tmp/brigade-notes/lint.txt has `FAIL:` lines, every one of them is a finding.
            Approve only when you found nothing. Do not edit any file but review.md. Do not push.

            The order of the notes:
            ${{ env.NOTES_ORDER }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/review.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      - name: Keep the reviewer's execution log
        if: always() && steps.review1.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/review1-execution.json" 2>/dev/null || true
      - name: Read the round-1 verdict
        id: verdict1
        run: |
          if [ -f "$NOTES_DIR/review.md" ]; then
            verdict=$(head -n 1 "$NOTES_DIR/review.md" | grep -o -E 'CHANGES_REQUESTED|APPROVED' | head -n 1)
          else
            echo "the reviewer wrote no review.md; the fix cycle runs on the lint alone" >&2
            printf 'CHANGES_REQUESTED\nThe reviewer wrote no review; address the lint findings, if any, and recheck every claim against the sources.\n' > "$NOTES_DIR/review.md"
            verdict=CHANGES_REQUESTED
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "round 1: lint ${{ steps.lint1.outcome }}, review $verdict"; cat "$NOTES_DIR/review.md"

      # ---- round 2: exactly one fix cycle ---------------------------------------------------------------------
      # The first draft is kept beside the second, so the second review can diff them and stay inside its bound.
      - name: Keep the first draft for the second review
        if: steps.lint1.outcome != 'success' || steps.verdict1.outputs.verdict != 'APPROVED'
        run: cp "$NOTES_DIR/notes.md" "$NOTES_DIR/notes-round1.md" 2>/dev/null || echo "the writer wrote no first draft; the second review reads the whole draft"
      - name: Fix the draft
        id: draft2
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        if: steps.lint1.outcome != 'success' || steps.verdict1.outputs.verdict != 'APPROVED'
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b   # v1
        with:
          github_token: ${{ github.token }}
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 50 --add-dir /tmp/brigade-notes"
          show_full_output: false
          prompt: |
            Your draft of the release notes for ${{ inputs.tag }} of brigade, /tmp/brigade-notes/notes.md, was
            not approved. Read /tmp/brigade-notes/lint.txt (deterministic checks; every `FAIL:` line is a fact) and
            /tmp/brigade-notes/review.md (the reviewer's findings), fix EVERY finding, and rewrite
            /tmp/brigade-notes/notes.md from the Bash tool with a quoted heredoc, exactly
            `tee /tmp/brigade-notes/notes.md <<'EOF'` … `EOF` (the Write tool is NOT available). The same rules apply: only what is in `CHANGELOG.md`
            or the tag's `git log`; only skills under `plugin/skills/` or `plugin/commands/`; only verbs that
            `/tmp/brigade-notes/brigade --help` lists; every shipped asset named; the version named; no
            "Unreleased", no placeholder; the order below. Change the sentences the findings name and what making
            room for them requires, and leave every other line as it is: the second review re-reads only what
            changed. Do nothing else: do not publish, do not edit the repository, do not push.

            The order of the notes, the same as for your draft and for the reviewer:
            ${{ env.NOTES_ORDER }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/notes.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      - name: Keep the fixer's execution log
        if: always() && steps.draft2.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/draft2-execution.json" 2>/dev/null || true
      - name: Lint the fix
        id: lint2
        if: steps.draft2.outcome == 'success'
        continue-on-error: true
        run: scripts/ci/release-notes-lint.sh "$NOTES_DIR/notes.md" "$RELEASE_TAG" | tee "$NOTES_DIR/lint.txt"; exit "${PIPESTATUS[0]}"

      - name: Review the fix
        id: review2
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        if: steps.draft2.outcome == 'success'
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b   # v1
        with:
          github_token: ${{ github.token }}
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 50 --add-dir /tmp/brigade-notes"
          show_full_output: false
          prompt: |
            You are the reviewer of the SECOND draft of the release notes for ${{ inputs.tag }} of brigade, at
            /tmp/brigade-notes/notes.md; the first draft is /tmp/brigade-notes/notes-round1.md, your first review
            is /tmp/brigade-notes/review.md and the lint's result is /tmp/brigade-notes/lint.txt. Your first
            review named what was wrong, the writer had one cycle to fix it, and that cycle was the last: a finding
            raised now cannot be fixed, it can only refuse the notes. So this review is BOUNDED: `diff` the two
            drafts, then check two things, by the same checks as before (every change in `CHANGELOG.md` or
            `git log --oneline <previous tag>..${{ inputs.tag }}`, every `/brigade:<name>` under `plugin/skills/`
            or `plugin/commands/`, every `brigade <verb>` in `/tmp/brigade-notes/brigade --help`, the assets exactly
            `gh release view ${{ inputs.tag }} --json assets`, the version named, no "Unreleased", no placeholder,
            the order below, no `FAIL:` line left in lint.txt): that every finding of your first review is fixed, and that the lines
            the fix changed are right. A line your first review did not name and the fix did not change was
            approved by your first review; it is not re-read, and nothing you notice in it changes the verdict. If
            notes-round1.md is absent, the writer wrote no first draft: review the whole draft as a first review.

            Overwrite /tmp/brigade-notes/review.md from the Bash tool with a quoted heredoc, exactly
            `tee /tmp/brigade-notes/review.md <<'EOF'` … `EOF` (the Write tool is NOT available): the FIRST line is
            exactly `APPROVED` or `CHANGES_REQUESTED`, then one finding per line, then, after a line that reads
            exactly `NOTES`, whatever you noticed outside the bound. Approve when the two things hold. Do nothing else.

            The order of the notes, the same as for your first review and for the writer:
            ${{ env.NOTES_ORDER }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/review.md:*)",
                  "Bash(diff /tmp/brigade-notes/notes-round1.md /tmp/brigade-notes/notes.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      # ---- the gate --------------------------------------------------------------------------------------------
      - name: Keep the second reviewer's execution log
        if: always() && steps.review2.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/review2-execution.json" 2>/dev/null || true
      - name: Gate on the final lint and verdict
        run: |
          if [ "${{ steps.draft2.outcome }}" = "skipped" ]; then
            lint="${{ steps.lint1.outcome }}"; round=1
          else
            lint="${{ steps.lint2.outcome }}"; round=2
          fi
          verdict=$(head -n 1 "$NOTES_DIR/review.md" | grep -o -E 'CHANGES_REQUESTED|APPROVED' | head -n 1)
          echo "round $round: lint $lint, review $verdict"
          if [ "$lint" != "success" ] || [ "$verdict" != "APPROVED" ]; then
            echo "::error::the notes were not approved after $round round(s); nothing was published (draft, lint and review are attached as an artifact)"
            exit 1
          fi
      - name: Attach the draft, lint and review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ inputs.tag }}
          overwrite: true             # a second attempt of this job replaces the first one's artifact, which `publish` takes by name
          path: |
            /tmp/brigade-notes/notes-round1.md
            /tmp/brigade-notes/notes.md
            /tmp/brigade-notes/lint.txt
            /tmp/brigade-notes/review.md
            /tmp/brigade-notes/*-execution.json
          if-no-files-found: ignore

  # ---- the two writes, by the shell, in a job of their own, idempotent under the concurrency group (v0.6.1's two
  # ---- simultaneous runs each opened an issue; the header) --------------------------------------------------
  # No agent runs here, and nothing here runs what an agent wrote: the notes are a file, handed to `gh` as text.
  # `needs: notes` is the gate: this job starts only when the draft was approved and lint-clean.
  publish:
    needs: notes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10         # one download and two writes; not a p90, a floor
    permissions:
      contents: write           # `gh release edit --notes` is a contents write, and the checkout
      issues: write             # the one announcement issue, and closing the earlier releases' (work item 403)
      actions: read             # downloads this run's artifact
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NOTES_DIR: /tmp/brigade-notes
    steps:
      - uses: actions/checkout@v7      # for scripts/ci/announce-release.sh, at the commit the run started on
      - name: Take the approved notes
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-notes-$RELEASE_TAG" --dir "$NOTES_DIR"
          test -s "$NOTES_DIR/notes.md"
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Say what a dry run would publish
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry run: nothing is published and nothing is announced for $RELEASE_TAG"
          echo "the notes this run would publish: $(wc -l < "$NOTES_DIR/notes.md") lines, beginning"
          head -n 1 "$NOTES_DIR/notes.md"
          echo "(the whole draft is in the run's artifact)"
      - name: Publish the notes
        if: ${{ !inputs.dry_run }}
        run: gh release edit "$RELEASE_TAG" --notes-file "$NOTES_DIR/notes.md"   # never --draft or --latest: release.yml owns the publish state
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Announce, once
        if: ${{ !inputs.dry_run }}
        # scripts/ci/announce-release.sh opens the announcement issue unless one with this title exists, and closes
        # the announcements of the releases before it, so the one open is the newest release's (work item 403:
        # nothing closed one, and 71 of the repository's 74 open issues were announcements). Its header has the
        # guard's history: the issues endpoint in place of the search index, after v0.6.1's two runs each opened
        # one (#10, #11). An existing issue skips the announcement, not the gate: the notes above were rewritten
        # anyway, because a re-dispatch that rewrites the same notes is a legitimate path (the header) and P9-8's
        # fix cycle relies on it. An API error here fails the step loud rather than opening a second issue: the
        # notes are published either way, and a re-dispatch retries.
        run: scripts/ci/announce-release.sh
        env: {GH_TOKEN: "${{ github.token }}"}
