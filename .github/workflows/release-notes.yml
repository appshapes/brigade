# Write a published release's notes from the repository's own record, gate them, and tell members to update.
#
# Four stages, in one job: a writer agent DRAFTS the notes to a file outside the checkout; a deterministic lint
# (scripts/ci/release-notes-lint.sh) refuses anything that does not exist — a skill, a CLI command, an asset — or
# that is placeholder, "Unreleased" or secret-shaped; a reviewer agent reads the draft against CHANGELOG.md, the
# tag's log and the plugin tree and answers APPROVED or CHANGES_REQUESTED with findings; the writer gets exactly
# one fix cycle; and only an APPROVED, lint-clean draft is published. The publish and the announcement issue are
# shell steps, not the agent: the two writes are deterministic and idempotent (a re-dispatch rewrites the same
# notes and opens no second issue). Why: the v0.5.0 notes, written by one agent straight onto the release page,
# named a `/brigade:sessions` skill that does not exist (P9-8, 2026-09-10).
#
# How it is reached. release.yml's last step dispatches this workflow after the publish (`workflow_dispatch`,
# actor `github-actions` — one of the two events the job token may raise, and the one event path from a tag push
# that claude-code-action accepts: a `workflow_call` from release.yml ran the action under the tag `push` and it
# refused, run 34537045037; the `release: published` trigger never fires from a `github.token` publish). It can
# also be run by hand: `gh workflow run release-notes.yml -f tag=v0.5.1`.
#
# The agents write their files with `tee` from the Bash tool, under a `Bash(tee <path>:*)` prefix rule: the first
# gated run (34541118273) showed the action honouring every Bash rule and none of the `Write(//tmp/…)` rules —
# two denials per agent, no file, and nothing published (the gate held). Each agent step's execution log is
# copied into the artifact, so the next failure is readable from the run page.
name: release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to write notes for, e.g. v0.5.1
        required: true
        type: string

jobs:
  notes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30         # not a p90: two bounded agent sessions, at most four, plus a build and two writes
    permissions:
      contents: write           # `gh release edit --notes` is a contents write
      issues: write             # the one announcement issue
      id-token: write           # claude-code-action's OIDC
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NOTES_DIR: /tmp/brigade-notes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # the agents read `git log <previous tag>..<tag>`; a shallow clone has no tags
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}

      # The two lists the lint needs, from the truth itself: the CLI's own `--help` of a fresh build (never a
      # hand-kept list), and the assets that actually shipped. The plugin's skills the lint reads from the tree.
      - name: Prepare the draft directory and the lint's lists
        run: |
          mkdir -p "$NOTES_DIR"
          go build -o "$NOTES_DIR/brigade" ./cmd/brigade
          commands=$("$NOTES_DIR/brigade" --help | awk '/^Commands:/{f=1;next} /^Global flags:/{f=0} f && /^  [a-z]/{print $1}' | tr '\n' ' ')
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | tr '\n' ' ')
          test -n "$commands" && test -n "$assets"
          { echo "BRIGADE_NOTES_COMMANDS=$commands"; echo "BRIGADE_NOTES_ASSETS=$assets"; } >> "$GITHUB_ENV"
          echo "commands: $commands"; echo "assets: $assets"
        env: {GH_TOKEN: "${{ github.token }}"}

      # ---- round 1 ------------------------------------------------------------------------------------------
      - name: Draft the notes
        id: draft1
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3   # v1 — pinned by SHA: the one action that runs a MODEL with repository write access
        with:
          allowed_bots: "claude,github-actions"   # github-actions is release.yml's dispatch actor (run 34539842793 measured the refusal)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --effort xhigh --max-turns 50"
          show_full_output: false
          prompt: |
            Release ${{ inputs.tag }} of brigade has been published. DRAFT its release notes — write them to the
            file /tmp/brigade-notes/notes.md and do nothing else. The Write tool is NOT available in this job:
            write the file from the Bash tool with a quoted heredoc, exactly
            `tee /tmp/brigade-notes/notes.md <<'EOF'` … `EOF`. You do not publish: a lint and a reviewer read
            that file after you, and a shell step publishes it if they approve.

            1. Read the section of `CHANGELOG.md` for this version. It is the authority on what changed and why;
               do not restate the commit log over it.
            2. Read `git log --oneline <previous tag>..${{ inputs.tag }}` for anything the changelog omitted, and
               `gh release view ${{ inputs.tag }} --json assets` for the assets that actually shipped.
            3. Compose: what changed for a USER of the plugin, then anything an ADAPTER AUTHOR must know, then the
               assets and their checksums file, every one of them by name. Keep the changelog's own wording where
               it exists. Never invent a change that is not in the changelog or the log.
            4. Name a slash command or a skill ONLY if it exists: list `plugin/skills/` and `plugin/commands/` and
               name only what is there. Name a `brigade <verb>` ONLY if `/tmp/brigade-notes/brigade --help` lists
               that verb. The roster is the `brigade sessions` command a session runs on request — there is no
               `/brigade:sessions` skill (the v0.5.0 notes invented one, and this is why you are being checked).
            5. The first line is one sentence saying what the release is. Use the version number, never
               "Unreleased". No placeholders.

            Do not edit any file in the repository. Do not push. Do not run `gh release edit` or `gh issue create`.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/notes.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }
          # No WebFetch, no WebSearch, no `gh` write verb: the draft is composed from the checkout and the job's
          # own token, and the writes happen in the shell steps below. NO GH_ACTIONS_TOKEN anywhere in this job.

      - name: Keep the drafter's execution log
        if: always() && steps.draft1.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/draft1-execution.json" 2>/dev/null || true
      - name: Lint the draft
        id: lint1
        continue-on-error: true   # a failure is a finding for the fix cycle, recorded for the writer to read
        run: scripts/ci/release-notes-lint.sh "$NOTES_DIR/notes.md" "$RELEASE_TAG" | tee "$NOTES_DIR/lint.txt"; exit "${PIPESTATUS[0]}"

      - name: Review the draft
        id: review1
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3   # v1
        with:
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --effort xhigh --max-turns 50"
          show_full_output: false
          prompt: |
            You are the reviewer of a DRAFT of the release notes for ${{ inputs.tag }} of brigade, at
            /tmp/brigade-notes/notes.md. Write your verdict to /tmp/brigade-notes/review.md from the Bash tool with
            a quoted heredoc, exactly `tee /tmp/brigade-notes/review.md <<'EOF'` … `EOF` (the Write tool is NOT
            available in this job): the FIRST line is exactly `APPROVED` or `CHANGES_REQUESTED`, then one finding
            per line, each naming the sentence and what is wrong. Do nothing else.

            Check every claim against the sources, assuming each is wrong until you have seen it right:
            - Every change described is in `CHANGELOG.md`'s section for this version or in
              `git log --oneline <previous tag>..${{ inputs.tag }}`; nothing is invented, nothing important
              in the changelog is missing, and the changelog's meaning is not distorted.
            - Every `/brigade:<name>` exists under `plugin/skills/` or `plugin/commands/`; every `brigade <verb>`
              is listed by `/tmp/brigade-notes/brigade --help`.
            - The assets named are exactly `gh release view ${{ inputs.tag }} --json assets`.
            - The notes address a USER of the plugin first, then an ADAPTER AUTHOR; they name the version;
              they say "Unreleased" nowhere; there is no placeholder.
            - If /tmp/brigade-notes/lint.txt has `FAIL:` lines, every one of them is a finding.
            Approve only when you found nothing. Do not edit any file but review.md. Do not push.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/review.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      - name: Keep the reviewer's execution log
        if: always() && steps.review1.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/review1-execution.json" 2>/dev/null || true
      - name: Read the round-1 verdict
        id: verdict1
        run: |
          if [ -f "$NOTES_DIR/review.md" ]; then
            verdict=$(head -n 1 "$NOTES_DIR/review.md" | grep -o -E 'CHANGES_REQUESTED|APPROVED' | head -n 1)
          else
            echo "the reviewer wrote no review.md; the fix cycle runs on the lint alone" >&2
            printf 'CHANGES_REQUESTED\nThe reviewer wrote no review; address the lint findings, if any, and recheck every claim against the sources.\n' > "$NOTES_DIR/review.md"
            verdict=CHANGES_REQUESTED
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "round 1: lint ${{ steps.lint1.outcome }}, review $verdict"; cat "$NOTES_DIR/review.md"

      # ---- round 2: exactly one fix cycle ---------------------------------------------------------------------
      - name: Fix the draft
        id: draft2
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        if: steps.lint1.outcome != 'success' || steps.verdict1.outputs.verdict != 'APPROVED'
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3   # v1
        with:
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --effort xhigh --max-turns 50"
          show_full_output: false
          prompt: |
            Your draft of the release notes for ${{ inputs.tag }} of brigade, /tmp/brigade-notes/notes.md, was
            not approved. Read /tmp/brigade-notes/lint.txt (deterministic checks; every `FAIL:` line is a fact) and
            /tmp/brigade-notes/review.md (the reviewer's findings), fix EVERY finding, and rewrite
            /tmp/brigade-notes/notes.md from the Bash tool with a quoted heredoc, exactly
            `tee /tmp/brigade-notes/notes.md <<'EOF'` … `EOF` (the Write tool is NOT available). The same rules apply: only what is in `CHANGELOG.md`
            or the tag's `git log`; only skills under `plugin/skills/` or `plugin/commands/`; only verbs that
            `/tmp/brigade-notes/brigade --help` lists; every shipped asset named; the version named; no
            "Unreleased", no placeholder. Do nothing else: do not publish, do not edit the repository, do not push.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/notes.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      - name: Keep the fixer's execution log
        if: always() && steps.draft2.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/draft2-execution.json" 2>/dev/null || true
      - name: Lint the fix
        id: lint2
        if: steps.draft2.outcome == 'success'
        continue-on-error: true
        run: scripts/ci/release-notes-lint.sh "$NOTES_DIR/notes.md" "$RELEASE_TAG" | tee "$NOTES_DIR/lint.txt"; exit "${PIPESTATUS[0]}"

      - name: Review the fix
        id: review2
        continue-on-error: true   # the file it wrote (or did not) is judged by the lint and the verdict step; the action also fails a step whose agent exceeded --max-turns after writing (run 34583310273)
        if: steps.draft2.outcome == 'success'
        uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3   # v1
        with:
          allowed_bots: "claude,github-actions"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --effort xhigh --max-turns 50"
          show_full_output: false
          prompt: |
            You are the reviewer of the SECOND draft of the release notes for ${{ inputs.tag }} of brigade, at
            /tmp/brigade-notes/notes.md; your first review is /tmp/brigade-notes/review.md and the lint's result is
            /tmp/brigade-notes/lint.txt. Overwrite /tmp/brigade-notes/review.md from the Bash tool with a quoted
            heredoc, exactly `tee /tmp/brigade-notes/review.md <<'EOF'` … `EOF` (the Write tool is NOT available):
            the FIRST line is exactly `APPROVED` or `CHANGES_REQUESTED`, then one finding per line. Apply the same checks as
            before — every change in `CHANGELOG.md` or `git log --oneline <previous tag>..${{ inputs.tag }}`,
            every `/brigade:<name>` under `plugin/skills/` or `plugin/commands/`, every `brigade <verb>` in
            `/tmp/brigade-notes/brigade --help`, the assets exactly `gh release view ${{ inputs.tag }} --json
            assets`, user first then adapter author, the version named, no "Unreleased", no placeholder, and no
            `FAIL:` line left in lint.txt. Approve only when you found nothing. Do nothing else.
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(tee /tmp/brigade-notes/review.md:*)",
                  "Read(//tmp/brigade-notes/**)",
                  "Bash(/tmp/brigade-notes/brigade --help:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git tag:*)",
                  "Bash(git diff:*)",
                  "Bash(git ls-files:*)",
                  "Bash(head:*)",
                  "Bash(wc:*)",
                  "Bash(file:*)",
                  "Bash(shasum:*)",
                  "Bash(sha256sum:*)",
                  "Bash(gh release view:*)",
                  "Bash(gh release list:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(jq:*)"
                ],
                "deny": [
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }

      # ---- the gate --------------------------------------------------------------------------------------------
      - name: Keep the second reviewer's execution log
        if: always() && steps.review2.outcome != 'skipped'
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$NOTES_DIR/review2-execution.json" 2>/dev/null || true
      - name: Gate on the final lint and verdict
        run: |
          if [ "${{ steps.draft2.outcome }}" = "skipped" ]; then
            lint="${{ steps.lint1.outcome }}"; round=1
          else
            lint="${{ steps.lint2.outcome }}"; round=2
          fi
          verdict=$(head -n 1 "$NOTES_DIR/review.md" | grep -o -E 'CHANGES_REQUESTED|APPROVED' | head -n 1)
          echo "round $round: lint $lint, review $verdict"
          if [ "$lint" != "success" ] || [ "$verdict" != "APPROVED" ]; then
            echo "::error::the notes were not approved after $round round(s); nothing was published (draft, lint and review are attached as an artifact)"
            exit 1
          fi
      - name: Attach the draft, lint and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-notes-${{ inputs.tag }}
          path: |
            /tmp/brigade-notes/notes.md
            /tmp/brigade-notes/lint.txt
            /tmp/brigade-notes/review.md
            /tmp/brigade-notes/*-execution.json
          if-no-files-found: ignore

      # ---- the two writes, by the shell, idempotent -------------------------------------------------------------
      - name: Publish the notes
        run: gh release edit "$RELEASE_TAG" --notes-file "$NOTES_DIR/notes.md"   # never --draft or --latest: release.yml owns the publish state
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Announce, once
        run: |
          version=${RELEASE_TAG#v}
          title="$version is out — run /brigade:update"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -q -F "$title"; then
            echo "announcement exists; not opening a second one"; exit 0
          fi
          gh issue create --title "$title" --body "$(printf 'Brigade %s is published. To get it, run:\n\n```\n/brigade:update\n```\n\nthen `/reload-plugins`.\n\nRelease notes: https://github.com/%s/releases/tag/%s\n' "$version" "$GITHUB_REPOSITORY" "$RELEASE_TAG")"
        env: {GH_TOKEN: "${{ github.token }}"}
        # No `claude` label: it is an announcement, not a work order, and the label would start an agent on it.
