# The hub of the agentic loop: every path that starts an agent with WRITE power lands here.
#
# Ported from thinktech-api/.github/workflows/claude.yml (read 2026-09-09). Brigade-specific deltas are listed
# under this file in .context/plans/agentic-workflows.md §4.1; the ones that matter most while reading:
#   * the writer commits with plain `git`, never `make commit`/`make push` (that chain runs `git add :/ .`,
#     which sweeps untracked files, and merges origin mid-run);
#   * `Bash(docker:*)` is allowed for exactly one reason: the pinned shellcheck 0.9.0 container CLAUDE.md
#     requires before any shell file is pushed;
#   * writes to plugin/bin/**, .claude/** and .github/workflows/** are DENIED, not merely discouraged;
#   * GH_ACTIONS_TOKEN — Rjae's classic PAT — lives in OTHER JOBS (`open-pr`, `approve-fixer-runs`), never in
#     the job that runs the agent. The agent's Bash children inherit its environment, and a classic PAT cannot
#     be scoped to one repository, so the credential is kept out of the JOB rather than merely out of a step
#     (§1.1.1 (iii)).
#
# Tag mode, deliberately: no `prompt:` input. In tag mode the action takes the issue/comment/review body as the
# prompt, which is what makes the scheduled workflows' agent-role prose (`Read .claude/agents/developer.md ...`)
# work and what makes a human's `@claude fix X` comment work. Supplying `prompt:` would switch the action to
# automation mode and change how event context is assembled — do not add one here without re-drilling the loop.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned, labeled]
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# One agent at a time per issue or PR. `cancel-in-progress: false` on purpose, unlike the reviewer below: a
# cancelled FIXER can die between `git commit` and `git push`, leaving a PR whose head never moves and whose
# "Verify the fix was pushed" step never runs — a silent park, which is the exact failure this file's verifiers
# exist to make impossible. The fix cap already bounds the loop, so queueing is safe.
#
# `queue: max` (work item 398, 2026-11-22): every run of an issue or a PR WAITS ITS TURN. Without it a group
# holds one waiting run, and a newer one takes its place: GitHub cancels the older. The factory labels a work
# order with three labels in one call, so three `labeled` runs reach this group at once, and whichever waited
# second was cancelled by the third. On 2026-10-01 that was the `claude` one (run 36856551752, issue #50): no
# agent ever worked the month's dependency update and nothing said so. The agent's own tracking comment
# replaces a waiting run the same way (run 45013297165 on issue #118, 2026-11-22), and so would a person's
# second `@claude` comment the first. With `max` up to 100 runs wait and none is replaced; the two label runs
# that are not `claude` take their turn, are skipped by the job's `if:` and end in seconds. GitHub refuses
# `queue: max` beside `cancel-in-progress: true`, which is one more reason for the `false` above.
concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  agent:
    # Seven clauses, ported unchanged in shape from the reference. The comment clauses exclude the comments of
    # `claude[bot]` (a recursion surface the moment `allowed_bots` admits the claude actor). The review clause
    # admits a `claude[bot]` review ONLY in changes_requested state: an '@claude' that leaked into an approval
    # must never race a fixer push against an arming auto-merge.
    #
    # Read the review clause once more, because its asymmetry is deliberate: a review from any OTHER login
    # whose body contains '@claude' starts the fixer EVEN IN APPROVED STATE. That is by design — a human writing
    # '@claude ...' into a review is explicit re-authorization, and it is how a person restarts the loop after the
    # fix cap has handed off. It cannot race auto-merge: auto-merge.yml arms only on `claude[bot]`'s approval,
    # so a human's approval arms nothing to race.
    #
    # The last clause is likewise a real, human path: applying the `claude` label to a PR starts an agent on it.
    # The action's write-access check gates it exactly as it gates every other event, and the label is the
    # human's authorization. §5 (i). It matches that label's OWN `labeled` event and no other (work item 398,
    # 2026-11-22). Until then every `opened` or `labeled` event on a PR that carried the label matched, so a PR
    # opened with `claude` beside two more labels raised four matching events; the concurrency group of that
    # time let two of them run an agent, and with `queue: max` all four would. A label put on at creation raises
    # its `labeled` event like any other (PR #119: one `opened` and one `labeled` run), so `opened` is not
    # listened for at all.
    #
    # `claude[bot]` is the Claude GitHub App, the identity the reviewer's `gh pr review` runs as. That is a
    # PREREQUISITE, not an assumption: without that App installed the reviewer's `gh pr review` lands as
    # github-actions[bot], no clause here matches, and the fix loop silently never arms. §5 (a) prints the
    # real login; re-pin every comparison to it if it differs.
    #
    # The login is compared WHOLE, here and in every step below, in auto-merge.yml and in
    # review-pull-request.yml (work item 397, 2026-11-22). Until then each of the thirteen was a prefix test,
    # `startsWith(…, 'claude')`, and anyone can register an account whose login begins with `claude`: its
    # reviews would have been taken for the reviewer agent's, counted against the fix cap and, in
    # auto-merge.yml, taken as the approval that arms a merge. A stranger's event that reaches the agent step
    # still meets the action's write-access check, as it always did. Never a prefix again:
    # scripts/ci/loop_login_test.go holds every workflow to the whole login.
    if: |
      (
        (github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]') ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]') ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && (github.event.review.user.login != 'claude[bot]' || github.event.review.state == 'changes_requested')) ||
        (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
        (github.event_name == 'issues' && github.event.action == 'assigned' && contains(join(github.event.issue.labels.*.name, ','), 'claude')) ||
        (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'claude')
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404       # the same label ci.yml's `fast` job uses: docker, jq, gh, shellcheck 0.9.0
    # MEASURED 2026-09-17 over the seventeen agent runs to date (the P9-3 re-pin; the P14-5 row): fixer runs
    # 100–525 s and 13–58 turns; developer runs 440 s (59 turns), 1245 s (61, the old ceiling), ~14 min at 90
    # and 124 turns (parts A and B of card 24) and 14 min at the 120 ceiling twice (part C). Rule (ci.yml's):
    # at least twice the longest projected job — 200 turns at the slowest observed pace (~20 s/turn on
    # 35153548072) is ~67 min plus setup, so 150. A hung agent must still not burn six hours of the
    # concurrency group. Re-measure when a job passes 75 min.
    timeout-minutes: 150
    # Published so the `open-pr` job below can act on it. A job output is the ONLY channel between the two jobs,
    # and that is exactly the point: `open-pr` holds the PAT and this job must not, so nothing crosses the
    # boundary but a branch name (§1.1.1 (iii)).
    outputs:
      branch_name: ${{ steps.claude.outputs.branch_name }}
      agent_outcome: ${{ steps.claude.outcome }}   # 'success' | 'failure' (continue-on-error below): open-pr's tie-breaker when no branch was pushed
      # What the agent's checkout held when its session ended (work item 398): 'true' when it held work that was
      # never pushed (a changed file, a commit no remote branch carries, a stash), 'false' when none, empty when
      # the step never ran or failed. `open-pr` closes an issue as "nothing to change" on 'false' alone.
      agent_left: ${{ steps.leftover.outputs.left }}
      agent_left_summary: ${{ steps.leftover.outputs.summary }}
    # NOTE what is NOT in this job: `secrets.GH_ACTIONS_TOKEN`. The agent's Bash children inherit this step's
    # environment (no `allowed_non_write_users`, so the action's conditional secret scrub and bubblewrap
    # isolation are both off — §1.1.1), and Rjae's classic PAT reaches EVERY repository their account can reach,
    # so it is kept out of the job entirely rather than merely out of an earlier step. Reachable here, by design
    # and by acceptance: CLAUDE_CODE_OAUTH_TOKEN and this job's own repo-scoped, job-lifetime GITHUB_TOKEN.
    permissions:
      contents: write          # the agent commits and pushes its branch
      pull-requests: write     # comments, labels
      issues: write            # the agent comments on the issue it is working (the CLOSE now happens in open-pr)
      id-token: write          # claude-code-action's OIDC
      actions: read            # `additional_permissions: actions: read` lets the agent read its own run logs
    steps:
      # ---------------------------------------------------------------- brake 1: the derived fix cap
      # The reviewer ends a CHANGES_REQUESTED body with an '@claude ...' instruction, which lands here through
      # pull_request_review. Each fix cycle is armed by exactly ONE `claude[bot]` CHANGES_REQUESTED review, so
      # counting those reviews IS the attempt counter: nothing to persist, nothing to reset, correct after a
      # re-run. Scoped to the reviews of `claude[bot]`, the whole login (a `claude`-prefixed stranger's reviews
      # must not spend the cap) — a HUMAN's '@claude' review is explicit re-authorization and bypasses
      # the cap. The handoff comment is posted once, carries no @-mention (nothing re-triggers), and uses
      # GITHUB_TOKEN precisely because its events never start workflows. GH_REPO is required: this step runs
      # pre-checkout, where `gh` has no git context.
      #
      # The staleness clause below is not decoration either. GitHub can deliver the same webhook twice, and the
      # per-PR concurrency group QUEUES rather than cancels (see the `concurrency` block above), so two runs of
      # this gate for ONE review are possible — and both would read the same review count, both would see
      # `count <= MAX_ATTEMPTS`, and two fixers would run on one blocker. Counting cannot distinguish them.
      # Head-SHA identity can, deterministically: a review addresses the head it was written against, so the run
      # proceeds only while the PR's CURRENT head still equals the triggering review's `commit_id`. The first
      # fixer's push moves the head; a duplicate delivery arriving after it sees head != commit_id and skips as a
      # stale review. No timestamps, no locks, no state to reset.
      - name: Gate autonomous fix attempts
        id: fix_gate
        if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'claude[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
          MAX_ATTEMPTS: 3
        run: |
          set -euo pipefail
          # Buffers stdout per attempt: a failed attempt (a mid-pagination transient, say) must not leak partial
          # output into the caller's capture and undercount the reviews.
          gh_retry() {
            local i out
            for i in 1 2 3; do
              if out=$("$@"); then printf '%s\n' "$out"; return 0; fi
              echo "attempt $i failed: $*" >&2
              [ "$i" -lt 3 ] && sleep 5
            done
            return 1
          }
          # Staleness first, before the count: a duplicate delivery of the same review, or a review of a head
          # some other push has already superseded, must not spend a fix-cap slot on work that already landed.
          head_now=$(gh_retry gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$head_now" != "$REVIEW_COMMIT_ID" ]; then
            echo "stale review — a fix already landed (review addressed $REVIEW_COMMIT_ID, head is now $head_now); skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ids=$(gh_retry gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.user.login == "claude[bot]" and .state == "CHANGES_REQUESTED") | .id')
          count=$(printf '%s\n' "$ids" | grep -c . || true)
          if [ "$count" -gt "$MAX_ATTEMPTS" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            if [ "$count" -eq $((MAX_ATTEMPTS + 1)) ]; then
              gh pr comment "$PR_NUMBER" --body "Autonomous fix cap reached: the reviewer has requested changes $count times (cap: $MAX_ATTEMPTS fix cycles). Handing off to a human — no further autonomous fixes will run on this PR."
            fi
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # This `if:` is repeated verbatim on the next four steps rather than split into a second job: a second job
      # would need its own checkout, its own Go cache and its own timeout for no gain. It reads "run unless this
      # is a `claude[bot]` review that the fix cap has stopped".
      - name: Checkout
        if: github.event_name != 'pull_request_review' || github.event.review.user.login != 'claude[bot]' || steps.fix_gate.outputs.proceed == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # `make checksums-check` rule (c) reads tags and the release listing; a shallow
                                # clone makes the agent's own gate run lie about what it proved.

      - name: Setup Go
        if: github.event_name != 'pull_request_review' || github.event.review.user.login != 'claude[bot]' || steps.fix_gate.outputs.proceed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod        # 1.27.0 from the `go` line; there is no toolchain line and none may be added
          cache-dependency-path: |
            go.sum
            tools.sum

      # golangci-lint is installed by `make setup-lint` into ./bin from a pinned install.sh. Doing it HERE rather
      # than inside the agent's session keeps a ~40s network install out of the turn budget and out of the
      # agent's error surface: `make lint` then just works when the agent reaches for it.
      - name: Install the pinned linter
        if: github.event_name != 'pull_request_review' || github.event.review.user.login != 'claude[bot]' || steps.fix_gate.outputs.proceed == 'true'
        run: make setup-lint

      - name: Code
        id: claude
        if: github.event_name != 'pull_request_review' || github.event.review.user.login != 'claude[bot]' || steps.fix_gate.outputs.proceed == 'true'
        # Since 2026-09-16 this step's failure is not the job's verdict (the d684bca / P14-1 shape): the action
        # fails a step whose agent hit --max-turns even after it pushed its branch (run 35153548072 died at 61
        # turns with the fix written and unpushed; `open-pr` was skipped because this job had failed). The
        # verdicts live downstream — `open-pr` for an issue (a pushed branch becomes a PR; none, and
        # `agent_outcome` decides between "nothing to change" and "died: leave the issue open"), "Verify the fix
        # was pushed" for the fixer, and "Fail on an undecided agent failure" for every other path.
        continue-on-error: true
        # THE ONE ACTION PINNED BY SHA, not by major tag — deliberately breaking the house style the other three
        # brigade workflows keep (§4's conventions; open question 7.7, adopted 2026-09-10). It is the only action
        # in this repository that runs a MODEL with repository write access, so a mutable tag moving under it
        # changes what an autonomous agent does, not merely how a step behaves.
        # Re-resolve for the current `v1` whenever this pin is bumped —
        #   gh api repos/anthropics/claude-code-action/git/ref/tags/v1 --jq '.object.sha'
        #   (an annotated tag needs one more hop: gh api .../git/tags/<sha> --jq '.object.sha')
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c   # v1
        with:
          # brake 2, second half. EXACTLY ONE login, explicit, never '*':
          #   claude — the Claude GitHub App, the actor of the fixer's own push (synchronize) and of the
          #            CHANGES_REQUESTED review that arms this job.
          # Nothing else belongs here. Issues and PRs raised by the automation are created with Rjae's classic
          # PAT (GH_ACTIONS_TOKEN), so their actor is RJAE — a human with write access — and they clear the
          # action's default write-access check without touching the bot filter at all. Earlier drafts carried a
          # second name for a GitHub App identity that no longer exists; do not re-add one.
          # '*' on a public repository would let ANY GitHub App invoke this agent with a prompt it controls.
          # The name is not a prefix: the action drops a trailing `[bot]` from the actor and from each entry and
          # compares the two whole, and consults the list only for an account that is not a User (read at this
          # pin, src/github/validation/actor.ts, 2026-11-22, work item 397).
          allowed_bots: "claude"
          # NEVER set allowed_non_write_users. The action's default check — write access on the triggering actor,
          # verified for issue, PR, comment and review events — is the single control that keeps a stranger's
          # comment on a PUBLIC repository from becoming a prompt on a self-hosted runner.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Opus for every workflow agent (the log's tier policy: CI/scaffolding/docs are Opus-tier). Fable never
          # runs in CI — its budget is hard and is reserved for the security path and adversarial passes.
          # --max-turns is a hard stop on a wandering session. 200 is MEASURED 2026-09-17 (the P9-3 re-pin; the
          # P14-5 row) over the seventeen runs to date: fixer 13, 13, 15, 16, 20, 25, 30, 33, 34, 37, 58;
          # developer 59 (run 34484257940), 61 (35153548072, the 60 ceiling), 73 (35156099663, issue #15), 90
          # (35231317403, card 24 part A), 124 (35237622142, part B, green), and 121 twice at the 120 ceiling
          # (35229062415 and 35245775186, part C — the largest work order, censored both times, nothing pushed).
          # Rule (P14-1's): at least 1.5 × the largest observed count, rounded up — 1.5 × 124 = 186, so 200;
          # re-measure when a session passes 150. The other half of the money question is already answered and
          # needs nothing here — the OAuth token is on Rjae's Max plan and THAT PLAN'S LIMITS ARE THE CEILING
          # (§1.1.1 (i), §4.10 credentials (ii)); there is no second ceiling to set.
          claude_args: "--model claude-opus-5-5 --effort xhigh --max-turns 200"
          # Public repository: run logs are world-readable. Keep the full agent output out of them.
          show_full_output: false
          # Lets the agent read its own workflow run logs when a gate fails in CI rather than locally.
          additional_permissions: |
            actions: read
          settings: |
            {
              "env": {
                "BASH_DEFAULT_TIMEOUT_MS": "900000",
                "BASH_MAX_TIMEOUT_MS": "1800000",
                "CLAUDE_CODE_DISABLE_BACKGROUND_TASKS": "1"
              },
              "permissions": {
                "allow": [
                  "Bash(make:*)",
                  "Bash(go:*)",
                  "Bash(git:*)",
                  "Bash(gh:*)",
                  "Bash(docker:*)",
                  "Bash(ls:*)",
                  "Bash(cat:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(rg:*)",
                  "Bash(sed:*)",
                  "Bash(jq:*)",
                  "Write(.context/plans/**)",
                  "Edit(.context/plans/**)"
                ],
                "deny": [
                  "Write(plugin/bin/**)",
                  "Edit(plugin/bin/**)",
                  "Write(.claude/**)",
                  "Edit(.claude/**)",
                  "Write(.github/workflows/**)",
                  "Edit(.github/workflows/**)",
                  "Read(./CLAUDE.user.md)",
                  "Read(./.env)",
                  "Read(./.env.*)"
                ]
              }
            }
          # The three `env` values keep a long command in the FOREGROUND until it ends (work item 398,
          # 2026-11-22). The Bash tool gives a command two minutes unless the model asks for more, and Claude
          # Code moves a command that reaches its limit to the background instead of stopping it. `make test`
          # takes about four minutes on this runner (222 s for `make build test go_test_p=4` in ci.yml's
          # `fast` job, run 45015837326; an agent's bare `make test` runs two packages at a time and is
          # slower). On 2026-11-22 the documenter (run 45013295630, issue #118, Claude Code 2.1.318) edited
          # two pages, reached "Run make docs-check and make test", and its session ended in `success` two
          # minutes later with nothing committed. What ended it is not read from the session, which
          # `show_full_output: false` keeps out of the log; the timing fits a test run that was moved to the
          # background and a session that did not wait for it. So: fifteen minutes by default (go test's own
          # limit is 15m), thirty at most, and no background at all, so that a command that still outlives
          # its limit STOPS with an error the agent can read. Claude Code's pages, read 2026-11-22: env-vars
          # (`BASH_DEFAULT_TIMEOUT_MS`, `BASH_MAX_TIMEOUT_MS`, the `env` key of settings) and tools-reference,
          # "Foreground commands that move to the background" (`CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1`).
          # A hung command now holds a turn for fifteen minutes, not two: the job's `timeout-minutes` and
          # `--max-turns` are the bounds, as before.
          #
          # Note what is ABSENT from `allow`, and why it is absent rather than forgotten: WebFetch and WebSearch.
          # The writer works from a checkout, `git`, `gh` and the build; nothing in this repository's work needs
          # the web. Withholding them removes the cheapest exfiltration verb an injected prompt can reach for —
          # one tool call, no subprocess. It does NOT eliminate egress: `Bash(make:*)` and `Bash(go:*)` execute
          # code (`go test` runs test binaries), so a hostile dependency can still open a socket. §1.1.1 states
          # the residual in full. Add either tool back only with a reason written on this line.
          #
          # Why each deny exists:
          #   plugin/bin/**        — VERSION and checksums.txt are produced ONLY by `make release` (CLAUDE.md).
          #                          An agent-written pin is a lie about what bytes ship. The deterministic
          #                          guard in review-pull-request.yml catches it if this is ever loosened.
          #                          brigade.exe, the committed Windows launcher, is the one file there an agent
          #                          legitimately moves — through `make launcher` (Bash, which this deny does not
          #                          reach), never an edit — because it links golang.org/x/sys and the monthly
          #                          bump changes its bytes; `make launcher-check` in ci.yml's `fast` job rebuilds
          #                          and diffs it, so an agent-built launcher is verified, not trusted.
          #   .claude/**           — the agent must not rewrite its own operating instructions, and agent memory
          #                          lives under .context/, never .claude/ (Rjae, dropped `record-memory`).
          #   .github/workflows/** — neither GITHUB_TOKEN nor the Claude App's token can push a change there
          #                          without the `workflows` permission; the reference observed the remote
          #                          rejection on 2026-08-02. Failing at the edit is a better error than failing
          #                          at the push, where the fixer looks green and lands nothing.
          #   CLAUDE.user.md/.env  — local-only credential files. They are gitignored and so absent from a fresh
          #                          checkout; the deny costs nothing and survives a mistake.
          # A permission pattern matches the command STRING, not a parsed argv: it is a guard rail, not a
          # security boundary (docs/security.md §5.1's whole-text matching caveat). The real boundaries are the
          # job's `permissions:` block and the token scopes.
          #
          # Note what the `allow` list is NOT doing: the general edit tools (Write, Edit, MultiEdit,
          # NotebookEdit) come from the action's OWN DEFAULTS, not from anything named here — which is how this
          # agent edits a Go file at all, when the only Write/Edit entries above are scoped to
          # .context/plans/**. The corollary matters for the reviewer in §4.2: withholding Write from an
          # `allow` list withholds nothing, so a read-only agent needs an explicit `deny` plus the job's
          # `permissions: contents: read`.

      # ---------------------------------------------------------------- what the agent left unpushed
      # An agent can end in `success` with its work still in the checkout: on 2026-11-22 the documenter edited
      # two pages and stopped before `git commit` (run 45013295630), and `open-pr` then closed issue #118 with
      # "The agent finished this run without changes", because "success and no branch" is all it could see.
      # This step looks: files changed or untracked, commits no remote branch carries, and a `make` or `go`
      # still running, which is what a command the session did not wait for looks like; a stash and a commit
      # on another local branch count as well. It never fails the job: `open-pr` decides with its two outputs.
      #
      # A work order only (`issues`). The fixer has its own verifier below, and on a pull request the action
      # puts `.claude/`, `CLAUDE.md` and their like back to the base branch's and leaves them unstaged
      # (`restoreConfigFromBase`, read at the pin), so a pull request that changes one of them would always
      # read here as work left behind.
      #
      # The script is read from the COMMIT the run started on (`git show`), not from the working tree: the
      # agent can edit every file of its checkout, this one's copy included, and a check the agent can rewrite
      # says nothing about the agent.
      - name: Say what the agent left unpushed
        id: leftover
        if: ${{ !cancelled() && github.event_name == 'issues' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        # Never the job's verdict: a failure here (a checkout git cannot read, say) would skip `open-pr` and
        # leave a pushed branch without its PR. It leaves `agent_left` empty instead, which `open-pr` reads as
        # "nobody looked": a pushed branch still gets its PR, and an issue with no branch stays open.
        continue-on-error: true
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/ci/agent-leftover.sh" > "$RUNNER_TEMP/agent-leftover.sh"
          sh "$RUNNER_TEMP/agent-leftover.sh"

      # ---------------------------------------------------------------- fail-loud verifier 1
      # The fixer can end green without its push landing: a narrated-only fix, or a remote rejection. No push
      # means no `synchronize`, no re-review, and a silently parked PR. Fail LOUD instead.
      - name: Verify the fix was pushed
        if: ${{ !cancelled() && github.event_name == 'pull_request_review' && github.event.review.user.login == 'claude[bot]' && steps.fix_gate.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head_now=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$head_now" = "$REVIEWED_SHA" ]; then
            echo "::error::Fix session ended without a push landing on the PR branch (head still at the reviewed SHA $REVIEWED_SHA) — no re-review will fire"
            exit 1
          fi

      # ---------------------------------------------------------------- fail-loud verifier 2
      # For the paths no verifier decides — a human's `@claude` comment or review — the agent step's own outcome
      # is the verdict; `continue-on-error` must not turn its death into a green job.
      - name: Fail on an undecided agent failure
        if: ${{ !cancelled() && steps.claude.outcome == 'failure' && github.event_name != 'issues' && !(github.event_name == 'pull_request_review' && github.event.review.user.login == 'claude[bot]') }}
        run: |
          echo "::error::The agent step failed (its log says why) and no downstream verifier decides this event"
          exit 1

  # ------------------------------------------------------------------ brake 3: the token IS the switch
  # A SEPARATE JOB, and the separation is a security boundary rather than tidiness (§1.1.1 (iii)). The PR must
  # raise `pull_request: opened` so the reviewer runs, and GITHUB_TOKEN's writes raise no workflow events — so
  # this step needs GH_ACTIONS_TOKEN, Rjae's classic PAT. Referencing that secret in a later STEP of the agent
  # job would be safe only on an ordering argument (a secret is materialised only for the step that names it);
  # putting it in a later JOB makes the argument unnecessary — the agent's job never holds `GH_ACTIONS_TOKEN` at
  # all, in any step, and no future `if:` edit can quietly make it reachable. That distinction MATTERS MORE with
  # a PAT than it did with the App token this file used to mint: a classic PAT cannot be scoped to one
  # repository and does not expire in an hour, so its blast radius is every repository Rjae's account can reach.
  # DO NOT collapse these jobs back into the agent's.
  #
  # `needs: agent` also gives the sequencing for free: a FAILED or SKIPPED agent job skips this one, which is the
  # behaviour the close-the-issue step below depends on (a failed run must leave the issue open for a retry).
  open-pr:
    needs: agent
    if: github.event_name == 'issues'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5          # one branch lookup and one `gh pr create`; not a p90, a floor
    permissions:
      issues: write             # ONLY for the close-when-nothing-changed step, which uses GITHUB_TOKEN on purpose
    steps:
      - name: Create PR
        id: create_pr
        env:
          # Rjae's classic PAT: its write DOES raise `pull_request: opened`, which is what starts the reviewer.
          # The PR's author is therefore Rjae, a human with write access — which is why `allowed_bots` above
          # needs only the one name, `claude`.
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          # GH_REPO: this job has no checkout, so gh has no git context to infer the repository from.
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.agent.outputs.branch_name }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
          TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The REMOTE BRANCH, not the action output, decides whether there is anything to open a PR for: the
          # action reports a branch name even on runs where it pushed nothing. Only a definitive 404 counts as
          # no-changes — a transient API failure must fail loudly, or the close step below would wrongly close
          # the issue over a live branch.
          if [ -z "$BRANCH" ]; then
            # An agent that died at its ceiling may have pushed before the action published its output (the
            # action names its branch `claude/issue-<n>-<stamp>` up front), so look for such a branch before
            # concluding that nothing changed; the newest stamp wins if earlier attempts left one behind.
            BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq "[.[] | select(.name | startswith(\"claude/issue-${ISSUE_NUMBER}-\")) | .name] | sort | last // empty")
            if [ -z "$BRANCH" ]; then
              echo "No branch name and no claude/issue-${ISSUE_NUMBER}-* branch — the agent pushed nothing, skipping PR creation."
              echo "pr_created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Recovered branch $BRANCH from the repository: the action published no branch name."
          fi
          if resp=$(gh api "repos/${GITHUB_REPOSITORY}/branches/$BRANCH" 2>&1); then
            :
          elif grep -q "HTTP 404" <<<"$resp"; then
            echo "No pushed branch — the agent made no changes, skipping PR creation."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::Branch existence check failed (not a 404) — leaving the issue open for retry: $resp"
            exit 1
          fi
          # The commit-message rule, enforced where the title is MINTED rather than hoped for at merge time.
          # CLAUDE.md: `<work item>: <Imperative summary>`, the number being the work item's on the team's
          # Brigade Board; the squash merge takes its subject from this title because
          # squash_merge_commit_title=PR_TITLE is set on the repository (see the brief's §4.10). This runner has
          # no board, so the number is never looked up here and never invented: a human's issue names its work
          # item in its title (`22: …`), so keep it. Issue titles written by _create-claude-issue.yml are
          # imperative and unprefixed: maintenance work orders, which take 15, the number of the build-out
          # (umbrella) card of the Trello days and not a work item of the board. Until 2026-09-16 only a
          # literal `15: ` was kept and every other number's PR was minted `15: <title>` and retitled by hand
          # (PR #8, `15:` → `19:`, the P11-6 row). And until work item 292 the pattern was `[0-9]*": "*`, which
          # kept any title that begins with a digit and holds a colon and a space anywhere: `3 flaky tests: retry
          # the watcher` landed with a prefix that is no work item's number. A title names its work item when the
          # text before its FIRST colon is all digits and a space follows that colon; anything else is a
          # maintenance work order. scripts/ci/loop_pr_title_test.go runs these lines on a handful of titles.
          number=${TITLE%%:*}
          case "$number" in
            ''|*[!0-9]*) PR_TITLE="15: $TITLE" ;;       # no number before the first colon: a maintenance work order
            *)
              case "$TITLE" in
                "$number: "*) PR_TITLE="$TITLE" ;;      # `<number>: <title>`: the issue names its work item, keep it
                *)            PR_TITLE="15: $TITLE" ;;  # digits alone, or no space after the colon
              esac ;;
          esac
          # Labels are copied from the ISSUE, which is where the policy decision was made:
          #   auto-merge  — set by the scheduled caller (documentation: yes; repository review: NO)
          #   maintenance — the execution-log-row exemption (owner ruling 4, 2026-09-09)
          LABELS=()
          if echo "$ISSUE_LABELS" | jq -e 'map(.name) | index("auto-merge")' >/dev/null 2>&1; then
            LABELS+=(--label auto-merge)
          fi
          if echo "$ISSUE_LABELS" | jq -e 'map(.name) | index("maintenance")' >/dev/null 2>&1; then
            LABELS+=(--label maintenance)
          fi
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "Closes #$ISSUE_NUMBER" \
            "${LABELS[@]}"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      # A branch was pushed AND the checkout held more: the PR is opened as always, and the issue says what did
      # not make it, because the PR's merge will close the issue over it (work item 398).
      - name: Say on the issue what the agent left beside its branch
        if: steps.create_pr.outputs.pr_created == 'true' && needs.agent.outputs.agent_left == 'true'
        env:
          GH_TOKEN: ${{ github.token }}      # a job-token comment raises no workflow event, and it carries no @claude
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_LEFT_SUMMARY: ${{ needs.agent.outputs.agent_left_summary }}
        run: |
          set -euo pipefail
          {
            echo "The agent pushed a branch, and its checkout also held work that it never pushed ($RUN_URL):"
            echo
            echo '```'
            printf '%s\n' "$AGENT_LEFT_SUMMARY"
            echo '```'
            echo
            echo "That work went with the runner. The pull request carries what was pushed."
          } > "$RUNNER_TEMP/left-beside-branch-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/left-beside-branch-comment.md"

      # A scheduled agent regularly finishes with nothing to change (docs already accurate, tree already clean).
      # That run pushes no branch, so no `Closes #N` PR ever arrives and the issue sits open until a human closes
      # it. The determination is STRUCTURAL — the agent ran to completion, pushed no branch and left its
      # checkout as it found it (`agent_left`, since work item 398) — so close on that rather than on the
      # wording of its comment. A FAILED agent job skips this whole job (`needs: agent`, no
      # `always()`), leaving the issue open for a retry. GITHUB_TOKEN on purpose: closing an issue must chain to
      # nothing — and it is this job's own token, not the PAT, so the close raises no event even by accident.
      # An agent that DIED (max turns, an API error) without pushing is not an agent that had nothing to change:
      # the old shape closed the issue as "nothing to change" either way. `agent_outcome` tells them apart.
      #
      # Nor is an agent that ended in `success` with its work unpushed (work item 398: issue #118 was closed as
      # "finished without changes" over two edited pages). `agent_left` is what the agent job's own step found
      # in the checkout, and the issue is closed on 'false' alone: this step takes every other case, a failed
      # agent, work left behind, and a checkout nobody looked at (an empty `agent_left`), says which it was,
      # and leaves the issue open under a red job.
      - name: Leave the issue open when the agent pushed nothing and may have left work
        if: steps.create_pr.outputs.pr_created == 'false' && (needs.agent.outputs.agent_outcome != 'success' || needs.agent.outputs.agent_left != 'false')
        env:
          GH_TOKEN: ${{ github.token }}      # a job-token comment raises no workflow event, and it carries no @claude
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_OUTCOME: ${{ needs.agent.outputs.agent_outcome }}
          AGENT_LEFT: ${{ needs.agent.outputs.agent_left }}
          AGENT_LEFT_SUMMARY: ${{ needs.agent.outputs.agent_left_summary }}
        run: |
          set -euo pipefail
          # Written under RUNNER_TEMP and read back with --body-file, so the summary needs no shell quoting. It
          # is fenced: its lines are file names from an agent's checkout, and the script that wrote it keeps
          # only names made of plain characters.
          {
            if [ "$AGENT_LEFT" = "true" ]; then
              echo "The agent's run ended without pushing a branch, and its checkout held work that it never pushed ($RUN_URL):"
              echo
              echo '```'
              printf '%s\n' "$AGENT_LEFT_SUMMARY"
              echo '```'
              echo
              echo "That work went with the runner."
            elif [ "$AGENT_OUTCOME" != "success" ]; then
              echo "The agent run ended in failure without pushing a branch ($RUN_URL)."
            else
              echo "The agent's run pushed no branch, and nothing looked at what its checkout held ($RUN_URL)."
            fi
            echo "Leaving this issue open: re-apply the \`claude\` label to run it again."
          } > "$RUNNER_TEMP/no-branch-comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/no-branch-comment.md"
          echo "::error::The agent pushed nothing (agent step: $AGENT_OUTCOME; work left in its checkout: ${AGENT_LEFT:-not looked at}) — issue #$ISSUE_NUMBER left open for a retry"
          exit 1

      - name: Close issue when the agent had nothing to change
        if: steps.create_pr.outputs.pr_created == 'false' && needs.agent.outputs.agent_outcome == 'success' && needs.agent.outputs.agent_left == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The agent has `gh` access and may already have closed its own issue (or a human did mid-run);
          # closing an already-closed issue errors.
          state=$(gh issue view "$ISSUE_NUMBER" --json state --jq .state)
          if [ "$state" = "CLOSED" ]; then
            echo "Issue #$ISSUE_NUMBER is already closed — nothing to do."
            exit 0
          fi
          gh issue close "$ISSUE_NUMBER" \
            --reason completed \
            --comment "The agent finished this run and left its checkout as it found it, with no file changed and no commit made, so there is no PR to close this issue. Closing automatically — its comment above records what was reviewed. Reopen if the run looks wrong."

  # ------------------------------------------------------------------ brake 3b: the loop approves its own fixer
  # GitHub holds every run a fixer push raises: `ci` and `review pr` on the new head sit at `action_required`
  # whatever the fork-PR approval policy says (MEASURED 2026-09-17, PR #22, push e849247 — the push is attributed
  # to github-actions[bot], which no policy value exempts; the P14-2 row). Until 2026-09-19 a human approved
  # them by hand, seven times on card 24 alone, and no fix round could close without one. This job makes the
  # call the human made — `POST …/actions/runs/<id>/approve` — from the PAT-holding side of the boundary above:
  # no agent runs here, nothing here reads model output, and GH_ACTIONS_TOKEN stays out of the agent's job
  # exactly as it does for `open-pr`. It runs after the agent job on every PR-bound event (a review, a review
  # comment, an issue comment on a PR, a PR labelled `claude`) and is a no-op when the head raised no held run —
  # a human's own push, an agent that pushed nothing, or the fix cap holding the fixer back. The head it approves
  # is the PR's CURRENT head, read from the API after the agent job ended, so it approves what the fixer pushed
  # and nothing older. `needs: agent` skips it when the agent job failed — the fixer path's "Verify the fix was
  # pushed" failing means there is no new head to approve.
  approve-fixer-runs:
    needs: agent
    if: |
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5          # a two-minute poll at most; not a p90, a floor
    permissions: {}             # the job token does nothing here: the approval authenticates with GH_ACTIONS_TOKEN
    steps:
      - name: Approve the runs GitHub held on the fixer's push
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha' 2>/dev/null); then
            echo "#${PR_NUMBER} is not a pull request; nothing to approve"
            exit 0
          fi
          # The held runs appear within seconds of the push, which happened before this job started; poll for
          # up to two minutes, approve whatever is held, and stop after one quiet poll once runs exist — the
          # second workflow's run can land a beat after the first, so one confirming poll is the whole margin.
          approved=0; seen=0; quiet=0; deadline=$((SECONDS + 120))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head}&per_page=50" --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion // "")"')
            held=$(printf '%s\n' "$runs" | awk '$3 == "action_required" {print $1}')
            for id in $held; do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null
              echo "approved run ${id} on ${head}"
              approved=$((approved + 1))
            done
            [ -n "$runs" ] && seen=1
            if [ -n "$held" ]; then quiet=0; elif [ "$seen" = 1 ]; then quiet=$((quiet + 1)); fi
            [ "$quiet" -ge 2 ] && break
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 10
          done
          echo "runs on ${head}: $(printf '%s\n' "$runs" | grep -c . || true); approved ${approved}"
