# Plan 7.7. Fires on a pushed `v*` tag and on nothing else: no branch trigger, no `workflow_dispatch`. The tag
# is pushed by `make release version=X.Y.Z` (scripts/release-prep.sh), and a published tag is never moved -- the
# release model is tag-based and stays that way (the owner's answer (1), 2026-09-04).
#
# scripts/ci/release-verify.sh EXISTS -- P1-8 landed it (35 lines) and the "Verify goreleaser's build matches the
# committed checksums" step below runs it. The header this replaces said it "does not exist yet"; that has been
# false since P1-8.
#
# The "Guard that the plugin pins this tag..." step below is the reproducibility gate the execution log names as
# a constraint that no convention may override. It is deliberately raw rather than wrapped in a make target:
# `make cross && diff dist-cross/checksums.txt plugin/bin/checksums.txt` is one of TWO independent expressions of
# the byte-identical cross-build (scripts/ci/checksums-check.sh rule (c) is the other), and a shared target would
# let one edit loosen both.
#
# What every script in this repository is, who invokes it, and which repository variables and secrets the
# workflows read: scripts/ci/README.md.
#
# Sixteen runs of this workflow to date on fifteen tags, from the D1 release rehearsal (run 33698279695,
# 2026-09-03, v0.0.1-rc1) to v0.6.4 (2026-09-14); the two comments below that were written from the rehearsal's
# measurements are still true. Fifteen tags, sixteen runs: v0.6.1 got TWO runs from ONE push. scripts/release-prep.sh
# ran its single `git push origin v0.6.1` (no push.followTags) and GitHub started runs 34779853757 (created
# 2026-09-13T20:08:49Z) and 34779854172 (20:08:50Z) -- both `push`, same commit 37941b8, actor Rjae, different
# check suites -- while the branch push of the same commit started exactly one ci run. GitHub delivers an event
# at least once, not exactly once (claude.yml's staleness guard already rests on that sentence), and the push that
# starts this workflow is no exception. Each run ran every step: each goreleaser created its own draft (388019994
# and 388019992, five assets each); `gh release edit v0.6.1 --draft=false` in the run that got there first
# published the draft it found by tag (388019992), and the other run's edit then resolved the tag to that
# now-published release and re-edited it; each run dispatched release-notes.yml once, so two notes runs opened
# two announcement issues (#10, #11); and draft 388019994 outlived both runs, unpublished, until it was deleted
# by hand three days later (P14-3). Three changes make the second delivery a green no-op: the `concurrency`
# group queues it behind the first run; the "Is this tag already published?" step then finds the first run's
# release and every later step is skipped; and "Discard the draft" deletes drafts by id, never a release by tag.
name: release
on:
  push:
    tags: ["v*"]
# One run per tag at a time, queued, never cancelled. A duplicate delivery of the tag push (v0.6.1, the header:
# runs 34779853757 and 34779854172, one second apart) waits for the first run and then finds the tag published.
# Not `cancel-in-progress`: cancelling the run in flight would strand its draft and end it red -- "Discard the
# draft" is `if: failure()`, which does not fire on cancellation -- and cancelling the queued one would leave a
# red run on a tag that released fine. GitHub keeps one running and one pending run per group, so a third
# delivery would cancel the pending one, which has done nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
# The release notes are NOT a called job of this workflow. They were, once (P9-5): `notes: uses:
# ./.github/workflows/release-notes.yml`, which runs claude-code-action under THIS workflow's event — a tag
# `push` — and the action refuses it: the first live run, 34537045037 on v0.5.0 (2026-09-10), died in the
# `notes` job with "Action failed with error: Unsupported event type: push" after `goreleaser` had published the
# release. Nor does release-notes.yml's own `release: published` trigger fire from here: the publish step below
# runs on `github.token`, and events raised by the job token start no workflow run — with two exceptions,
# `workflow_dispatch` and `repository_dispatch`. So the last step dispatches release-notes.yml, which then runs
# under an event the action supports, with the tag as its input; this workflow's own ceiling shrinks back to
# what its one job uses plus the dispatch (`actions: write`), and the notes job's `issues: write` and
# `id-token: write` live in release-notes.yml, where they are granted.
permissions:
  contents: write                                   # create the release and upload assets
  actions: write                                    # dispatch release-notes.yml after the publish
jobs:
  goreleaser:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # One observed run: the D1 rehearsal, 33698279695, took 1m35s end to end (of which the `make cross` guard was
    # 1m02s and goreleaser itself 9s). A single sample is not a p90, so this bound is deliberately looser than
    # twice it: the workflow runs once per release, a slow module fetch on a cold runner is the plausible
    # variance, and re-running a timed-out release job is more expensive than waiting.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}                      # goreleaser needs the tag history for the changelog
      - name: Is this tag already published?
        id: published
        # The tag endpoint answers for PUBLISHED releases only (a draft is not reachable by tag: 404), so a 200
        # means an earlier run on this same tag has already published -- a duplicate delivery of the push (the
        # header). Every later step is gated on this answer: when it is yes the job ends green having done
        # nothing else. Not `gh release view <tag>`: when no published release matches, gh falls back to a draft
        # of that name, and a draft is exactly what a queued duplicate must not mistake for published. A 404 (or
        # any API error) means "not published" and the run proceeds as a first run; if it was in fact a duplicate,
        # goreleaser v2.18.0 finds the published release, gets 422 already_exists on every asset upload
        # (replace_existing_artifacts is unset) and fails the step -- red, but the published release is untouched,
        # because the discard step below deletes drafts only. That is why the duplicate is stopped here, before
        # goreleaser, and not merely serialised.
        run: |
          if draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft') && [ "$draft" = "false" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_REF_NAME} is already published: this run is a duplicate delivery of the tag push and does nothing else"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env: {GH_TOKEN: "${{ github.token }}"}
      - uses: actions/setup-go@v7
        if: steps.published.outputs.exists != 'true'
        with: {go-version-file: go.mod}             # the same toolchain the developer used for plugin/bin/checksums.txt
      - name: Guard that the plugin pins this tag and that the source reproduces the committed checksums
        if: steps.published.outputs.exists != 'true'
        run: |
          test "v$(cat plugin/bin/VERSION)" = "${GITHUB_REF_NAME}"
          test "$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' plugin/.claude-plugin/plugin.json)" = "$(cat plugin/bin/VERSION)"
          make cross && diff dist-cross/checksums.txt plugin/bin/checksums.txt
      - uses: goreleaser/goreleaser-action@v7
        if: steps.published.outputs.exists != 'true'
        # Pinned to the exact version `make setup-goreleaser` installs and `make release` rehearses with
        # (goreleaser_version in the Makefile). "~> v2" would resolve to whatever the latest 2.x is at run
        # time, so the tag's release could be built by a goreleaser the developer never rehearsed against --
        # and the whole checksum flow rests on the release job reproducing the committed bytes exactly.
        with: {distribution: goreleaser, version: "v2.18.0", args: release --clean}   # builds, checksums, creates a DRAFT release
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Verify goreleaser's build matches the committed checksums
        if: steps.published.outputs.exists != 'true'
        run: scripts/ci/release-verify.sh dist/checksums.txt plugin/bin/checksums.txt   # sorted hash columns must be identical (P1-8)
      - name: Publish
        if: success() && steps.published.outputs.exists != 'true'
        # GitHub's REST API: "Drafts and prereleases cannot be set as latest" (make_latest), and goreleaser's
        # `prerelease: auto` marks a tag with a pre-release suffix (v0.0.1-rc1) as a prerelease -- so `--latest`
        # is passed only for a final version. Found while preparing the P2-12 rehearsal: with `--latest`
        # unconditional, the rc publish fails with 422 and the step below deletes the draft it just verified.
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) gh release edit "${GITHUB_REF_NAME}" --draft=false ;;
            *)   gh release edit "${GITHUB_REF_NAME}" --draft=false --latest ;;
          esac
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Dispatch the release notes
        if: success() && steps.published.outputs.exists != 'true'
        # A workflow_dispatch run is the one path from a tag push to claude-code-action (the header explains);
        # the job token may raise it, and release-notes.yml takes the tag as its input.
        run: gh workflow run release-notes.yml -f tag="${GITHUB_REF_NAME}"
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Discard the draft
        # Drafts only, by id -- never `gh release delete <tag>`, which resolves to the PUBLISHED release when one
        # exists: a failure after the Publish step (the dispatch, say) would have deleted the release just
        # published, assets included. The listing takes every draft carrying this tag, not only this run's --
        # v0.6.1's duplicate run left draft 388019994 on the repository for three days, the measured case of a
        # draft outliving its run (the header) -- and `|| true` throughout: cleanup never masks the failure that
        # brought us here. Not on a duplicate delivery: with the tag published nothing here is this run's.
        if: failure() && steps.published.outputs.exists != 'true'
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == env.TAG) | .id' \
            | while read -r id; do
                echo "deleting draft release ${id} of ${TAG}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true
              done || true
        env: {GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}"}
