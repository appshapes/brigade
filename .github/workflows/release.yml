# Plan 7.7, transcribed unchanged.
# DEPENDS ON P1-8: the "Verify goreleaser's build matches the committed checksums" step runs
# scripts/ci/release-verify.sh, which is a P1-8 deliverable and does not exist yet. This workflow
# fires only on a `v*` tag, and no tag exists (nor may one be pushed before P1-8 and P2-12's
# release rehearsal), so the missing script cannot make a run red today.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write                                   # create the release and upload assets
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}                      # goreleaser needs the tag history for the changelog
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}             # the same toolchain the developer used for plugin/bin/checksums.txt
      - name: Guard that the plugin pins this tag and that the source reproduces the committed checksums
        run: |
          test "v$(cat plugin/bin/VERSION)" = "${GITHUB_REF_NAME}"
          test "$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' plugin/.claude-plugin/plugin.json)" = "$(cat plugin/bin/VERSION)"
          make cross && diff dist-cross/checksums.txt plugin/bin/checksums.txt
      - uses: goreleaser/goreleaser-action@v7
        # Pinned to the exact version `make setup-goreleaser` installs and `make release` rehearses with
        # (goreleaser_version in the Makefile). "~> v2" would resolve to whatever the latest 2.x is at run
        # time, so the tag's release could be built by a goreleaser the developer never rehearsed against --
        # and the whole checksum flow rests on the release job reproducing the committed bytes exactly.
        with: {distribution: goreleaser, version: "v2.18.0", args: release --clean}   # builds, checksums, creates a DRAFT release
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Verify goreleaser's build matches the committed checksums
        run: scripts/ci/release-verify.sh dist/checksums.txt plugin/bin/checksums.txt   # sorted hash columns must be identical (P1-8)
      - name: Publish
        if: success()
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Discard the draft
        if: failure()
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true
        env: {GH_TOKEN: "${{ github.token }}"}
