# THROWAWAY, work item 438. It is removed in the work item's last commit. Started by hand only.
#
# Its first form, in 0f32e4e3, minted the Claude GitHub App's token as `anthropics/claude-code-action` does
# and asked GitHub what it reaches: run 45476572377, which is ADR 0033's measurement. That job is gone, and
# with it the one grant of `id-token` outside the two jobs scripts/ci/agent_token_test.go names: this file can
# no longer mint anything.
#
# What is left is one dispatch. release.yml starts release-notes.yml after a publish with its job's own token,
# so the actor of that run is `github-actions[bot]`, a bot the action lets through by `allowed_bots`. A
# dispatch by hand has a person as its actor and does not take that path. This job makes the same dispatch as a
# DRY RUN on a release that is already published: the tag and `dry_run=true` are written here and are no
# inputs, so a run of this workflow can publish nothing and announce nothing.
name: probe 438

on:
  workflow_dispatch:

concurrency:
  group: probe-438
  cancel-in-progress: false

permissions: {}

jobs:
  notes-dry-run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5          # one API call; not a p90, a floor
    permissions:
      actions: write            # the dispatch, one of the two events a job's own token may raise (release.yml's header)
    steps:
      - name: Dispatch the notes' dry run as release.yml dispatches the notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-notes.yml -f tag=v0.60.0 -f dry_run=true
