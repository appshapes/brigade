# Plan 7.7. One deviation from the plan text remains, deliberate and marked below:
#   (d) a `reproducibility` job diffs the `fast` and `macos` checksums instead of leaving the comparison to
#       whoever reads the two job summaries — see the comment on that job. Keep (d).
#
# The other three are gone. Each was a step disabled by a constant-false `if:` until its deliverable existed:
# P1-8 removed (b) (the `fast` job ran `make cross` in place of `make checksums-check`) and (c)
# (`make plugin-check`), both because scripts/ci/*.sh did not exist yet; P2-1 removed (a) (the whole
# `supabase` job, until the migrations existed); P2-11 removed the gates on `make test-integration` and on
# the coverage summary that depends on it; P4-1 removed the LAST one, on the `supabase` job's `make e2e`
# step, by landing scripts/proof.sh. No constant-false gate remains anywhere in this file, so every step runs
# on every push and a green conclusion means every step passed. Do not reintroduce one: gate on a real
# condition or do not add the step.
#
# Every job below sets `timeout-minutes`, because GitHub's default is 360: a hung job burns six hours of the
# concurrency group before anyone notices. The convention and its measured reason are the house's
# (thinktech-web/.github/workflows/ci.yml:24-26 -- "Every job sets `timeout-minutes` well above its p90 because
# the default is 360 min: six e2e jobs hung in the Playwright install step for six hours each in August 2026").
# Each bound here is twice the p90 of TEN real green runs of this workflow, rounded up, and each comment names
# the slowest of the ten. Those runs are 33908735238, 33910839825, 33912150864, 33916051347, 33918074768,
# 33920933602, 33936887138, 33938576261, 33941694993 and 33942289055 (2026-09-04 and 2026-09-05). Re-measure
# with `gh run list --workflow ci.yml --json databaseId` and `gh run view <id> --json jobs` before tightening
# one: a bound under a job's real p90 turns a green matrix red for no reason. Every one of those ten runs was
# measured on GITHUB-HOSTED hardware (`ubuntu-latest`, `macos-latest`), and since P5-17 these jobs run on
# Blacksmith, whose first green run of this file (33996821598, 2026-09-05) was faster on all four -- fast 3m00s,
# macos 2m50s, reproducibility 9s, supabase 6m03s -- so every bound below is LOOSE on the new hardware rather
# than wrong: leave each one alone until ten Blacksmith runs give it a new p90.
name: ci
on:
  push: {branches: [master]}
  pull_request: {}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  fast:                                   # no Docker; 4m28s-5m17s across the ten runs above
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 11                   # 2x the 5m16s p90; slowest observed 5m17s on run 33941694993
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}            # P1-8's checksums-check needs tags and the release listing
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod         # 1.27.0 from the `go` line (no toolchain line, 7.2)
          cache-dependency-path: |
            go.sum
            tools.sum
      # What the IMAGE provides, printed. Four steps below depend on tools no workflow installs: `shellcheck`
      # (plugin-check.sh check 9, which DIES when CI is set), `curl` and `jq` (scripts/ci/keepalive.sh's preflight
      # -- keepalive.yml runs on the same label and has no CI coverage at all, so a missing tool there surfaces a
      # day later by e-mail), `docker` (the `supabase` job) and `gh` (checksums-check.sh rule (c), release.yml's
      # Publish step). GitHub publishes its image's contents and Blacksmith says its images carry "the same
      # dependencies supported by GitHub's official runner image" -- neither is a measurement of the runner that
      # actually ran, and CLAUDE.md's shellcheck sentence rests on a version this repository has never printed
      # (inferred from SC2317 vs SC2329 on run 33753678522, on the old GitHub-hosted runner). So print it. This
      # step never gates: each tool's real gate is where it is used. `go version` is setup-go's toolchain, not
      # the image's.
      - name: Runner image inventory
        run: |
          {
            echo '### Runner image'
            echo '```'
            (. /etc/os-release && echo "$PRETTY_NAME $(uname -m)") || echo 'os-release: ABSENT'
            for t in shellcheck go docker jq curl gh; do
              if ! command -v "$t" >/dev/null 2>&1; then echo "$t: ABSENT"; continue; fi
              case "$t" in
                shellcheck) shellcheck --version | sed -n 's/^version: /shellcheck /p' ;;
                go)         go version ;;
                docker)     docker --version ;;
                jq)         echo "jq $(jq --version)" ;;
                curl)       curl --version | head -1 ;;
                gh)         gh --version | head -1 ;;
              esac || echo "$t: version check FAILED"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make setup-lint              # golangci-lint via install.sh into ./bin (pinned)
      - run: make typecheck tidy-check
      - run: make lint
      - run: make build test              # unit + testscript + harness + conformance(fs), -race, coverage profile
      - run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - run: make vuln deps-check schema-check
      # `checksums-check` depends on `cross`, so all four targets are still rebuilt with the release flags and
      # dist-cross/checksums.txt still exists for the two steps below. GH_TOKEN is for rule (c)'s release
      # fallback (`gh release download v$VERSION`); in the pre-release 0.0.0 state the script never reaches it.
      - run: make checksums-check         # plugin/bin pins vs a fresh cross-compile or the published release
        env: {GH_TOKEN: "${{ github.token }}"}
      - run: cat dist-cross/checksums.txt >> "$GITHUB_STEP_SUMMARY"   # cross-host reproducibility evidence (P1-1)
      - uses: actions/upload-artifact@v7
        with: {name: checksums-ubuntu, path: dist-cross/checksums.txt, if-no-files-found: error}
      # scripts/ci/plugin-check.sh then scripts/ci/no-secrets.sh: the plugin/ file allowlist, mode 100755 in
      # git for the bootstrap and 100644 for everything else, VERSION == plugin.json, no .mcp.json/mcpServers/
      # channels, exec-form hooks whose commands exist, sh/bash/zsh syntax, shellcheck (a hard failure here
      # because CI is set), and the secret scan.
      - run: make plugin-check

  macos:                                  # the primary user platform: unix sockets, ps -o lstart, shasum paths
    # Blacksmith's migration wizard mapped `macos-latest` to the PINNED `blacksmith-6vcpu-macos-15`, not to
    # `blacksmith-6vcpu-macos-latest`: this job now runs one macOS major BEHIND the platform the developer and
    # the users are on. `blacksmith-6vcpu-macos-latest` (currently 26) and `blacksmith-6vcpu-macos-26` both
    # exist (docs.blacksmith.sh/blacksmith-runners/overview, read 2026-09-05). Which of the three this job
    # should name is the owner's call and is P5-17's one open decision; the label below is the wizard's.
    runs-on: blacksmith-6vcpu-macos-15    # macOS 15.7.4 arm64 [verified: run 33996821598, job 101388707813]
    timeout-minutes: 7                    # 2x the 3m02s p90; slowest observed 3m12s on run 33920933602
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      # As in `fast`, and for the same reason: the macOS version is a fact about the runner, not about the tag.
      # `make cross` below picks `sha256sum` or `shasum -a 256` by what is on PATH (the Makefile's `sha256`), so
      # which one this image has is exactly what the `reproducibility` job's diff depends on. Run 33996821598
      # already answered it once -- job 101388707813 echoed `cd dist-cross && sha256sum brigade_* > checksums.txt`
      # -- so this step keeps a measured fact printed rather than settling an unknown.
      - name: Runner image inventory
        run: |
          {
            echo '### Runner image'
            echo '```'
            (sw_vers && uname -m) || echo 'sw_vers: FAILED'
            go version || echo 'go: version check FAILED'
            for t in sha256sum shasum; do
              if command -v "$t" >/dev/null 2>&1; then echo "$t: $(command -v "$t")"; else echo "$t: ABSENT"; fi
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make build && go test -race -shuffle=on -count=1 -timeout 15m ./...
      - run: make cross && cat dist-cross/checksums.txt >> "$GITHUB_STEP_SUMMARY"   # must equal the fast job's and the developer's (P1-1)
      - uses: actions/upload-artifact@v7
        with: {name: checksums-macos, path: dist-cross/checksums.txt, if-no-files-found: error}

  # (d) P1-1's cross-host reproducibility criterion, as an assertion rather than as two job summaries a human
  #     is trusted to compare. `cat >> $GITHUB_STEP_SUMMARY` in the two jobs above cannot go red however far
  #     the ubuntu and macOS builds diverge, so on its own it is evidence, not a gate. The two files are
  #     directly comparable: GNU `sha256sum` and Perl `shasum -a 256` emit byte-identical
  #     "<hash>  <name>" lines [verified], both jobs read the same version from plugin/bin/VERSION, and
  #     `make cross` pins GOTOOLCHAIN, CGO_ENABLED, GOFLAGS, GOAMD64 and GOARM64 (7.4).
  reproducibility:
    needs: [fast, macos]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Two artifact downloads and a diff: 3s to 8s across the ten runs, slowest 8s on run 33936887138. Twice that
    # p90 is under a minute, which is a bound set by network variance rather than by the job; 5 is the floor.
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with: {name: checksums-ubuntu, path: ubuntu}
      - uses: actions/download-artifact@v8
        with: {name: checksums-macos, path: macos}
      - name: The ubuntu and macOS cross-builds must be byte-identical
        run: |
          diff ubuntu/checksums.txt macos/checksums.txt
          {
            echo '### Cross-host reproducibility: ubuntu == macOS'
            echo '```'
            cat ubuntu/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  supabase:                               # Docker; 6m53s-7m27s across the ten runs above, of which the
                                          # `make supabase-start` step is 51s-1m10s and the ghcr.io image pulls
                                          # inside it 34s-38s (timed from the step logs of 33942289055, 33941694993)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: fast
    timeout-minutes: 25                   # unchanged and deliberately loose: 3x the 7m25s p90, slowest 7m27s on
                                          # run 33942289055, because this job pulls images over the network
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - uses: supabase/setup-cli@v3
        with: {version: 2.116.0}          # pinned explicitly; no lockfile exists any more to read it from
      - run: make build
      - run: make supabase-start supabase=supabase   # `supabase ?=` in the Makefile: CI overrides the npx form with
      - run: make test-db supabase=supabase          # the setup-cli binary, so local and CI run the same recipes and
      - run: make supabase-env advisor-lints supabase=supabase   # the version is pinned in exactly one place per context
      # go test (the self-skip of testutil.RequireSupabase is lifted by BRIGADE_TEST_LIVE=1 and .env.test) +
      # conformance(supabase) --slow, both against the stack started above. BRIGADE_TEST_LIVE=1 and
      # BRIGADE_TEST_DOCKER=1 both come from the Makefile recipe: the first is the opt-in EVERY live test waits
      # on, so this job is the only place in CI that runs them (`fast` and `macos` have no stack and no
      # .env.test and skipped them already); the second adds the fault tests that stop the realtime container
      # and restart the whole stack.
      # This step's gate used to name scripts/ci/conformance-setup-supabase.sh as P2-11's landing. The
      # script exists (P2-6..P2-10 landed it) but the Makefile recipe no longer uses it: --setup was
      # dropped so the suite provisions its own teams through the BRIGADE_SUPABASE_* pair and RUNS C-28 and
      # C-40 instead of skipping them. It stays as the documented out-of-band alternative for a backend
      # whose principals are provisioned elsewhere; the reasoning is on the `test-integration` recipe in
      # the Makefile. GOCOVERDIR must EXIST before an instrumented child looks for it — Go's coverage runtime does
      # not create it, it warns on stderr and writes nothing — and `covdata percent` on a missing directory
      # is an error, so the directory is made here rather than left to whichever step happens to run.
      - name: integration suite and conformance(supabase), instrumented across the process boundary
        run: |
          mkdir -p "${{ runner.temp }}/cov"
          make test-integration
        env: {BRIGADE_COVER: "1", GOCOVERDIR: "${{ runner.temp }}/cov"}
      # BRIGADE_COVER=1 matters as much as GOCOVERDIR here: `e2e: build` rebuilds bin/brigade and
      # `cover_flags` keys off BRIGADE_COVER, so without it this step would rebuild UNINSTRUMENTED and
      # contribute nothing to the summary below. proof.sh passes GOCOVERDIR through to the top-level
      # `brigade` processes it starts; adapter CHILDREN never see it (adapterkit.ChildEnv's allow-list) and
      # warn into the harness-routed adapter log, which proof.sh deliberately does not assert empty. A
      # SIGKILLed instrumented watcher writes no coverage; that is documented and accepted (plan 2701).
      - run: make e2e                     # scripts/proof.sh, watcher in --sink mode, no LLM (D31)
        env: {BRIGADE_COVER: "1", GOCOVERDIR: "${{ runner.temp }}/cov"}
      # Coverage of bin/brigade as the conformance suite drove it; the `make e2e` step above adds its own.
      # The go test process's own coverage is not here: it is the `fast` job's cover.out profile.
      - run: go tool covdata percent -i="${{ runner.temp }}/cov" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make supabase-clean supabase=supabase

  deploy-staging:                         # Phase 5; only when a hosted staging project exists
    if: github.ref == 'refs/heads/master' && vars.BRIGADE_STAGING == 'true'
    needs: [fast, supabase]
    environment: staging
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # No observed run: `vars.BRIGADE_STAGING` has never been set, so this job has only ever been skipped. The
    # bound is therefore NOT a measured p90; it is read across from the `supabase` job's own CLI steps
    # (supabase/setup-cli 7s, and three hosted `supabase` calls) on run 33942289055, with room for a hosted
    # project's latency. Replace it with 2x the p90 of the first ten real runs once staging exists.
    timeout-minutes: 15
    env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: {version: 2.116.0}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - run: supabase db push --dry-run && supabase db push && supabase config push --yes
