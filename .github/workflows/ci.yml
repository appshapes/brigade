# Plan 7.7, in the shape card 245 gave it on 2026-11-10 to bring a push's run from eleven minutes to under five.
# Across the 25 green runs on master before it, the run took 11.0 minutes at the median and 12.4 at the p90,
# because it was two jobs END TO END: `fast` (4.5 median, 5.5 p90), then `supabase` (5.9, 6.6), which waited on
# it. Three things changed, each a departure from the plan text and each deliberate:
#
#   (e) The test jobs run SIDE BY SIDE: no job below waits on another except `deploy-staging`. The run is now as
#       long as its longest job instead of the sum of two. What that costs: a red `fast` no longer skips the
#       stack jobs, so a commit that fails lint still pays for two local Supabase stacks.
#   (f) Lint has a job of its own (`lint`), and the stack work is two jobs on two stacks: `supabase` (pgTAP, the
#       advisor lints, the adapter's live tests) and `e2e` (conformance(supabase) and `make e2e`). Timed on run
#       42871717045, the last before the change: `make lint` 60 s of `fast`'s 325 s; the adapter's live tests
#       139 s, conformance(supabase) 77 s and `make e2e` 78 s of `supabase`'s 355 s. `fast` also runs its tests
#       four packages at a time (`go_test_p=4`; the Makefile's comment on `go_test_flags` says why 2 is the pin
#       everywhere else).
#   (g) There is NO `macos` job, and so no `reproducibility` job, which diffed the ubuntu and macOS cross-builds
#       (the former deviation (d)). Rjae, 2026-11-10: "we don't need a macOS runner". In the 497 runs of this
#       workflow up to that day `macos` failed four times -- three beside `fast` on the same change, and once
#       alone (run 33684780907: a timing race in a platform-neutral test of the Supabase adapter, fixed in the
#       test) -- and `reproducibility` never failed. A person's commit has already passed `make push`
#       (typecheck, pull, build, test with -race) on the developer's machine, a Mac today, before it reaches
#       origin, and `make release` goes through the same chain; `fast` still cross-compiles both darwin targets
#       (`make checksums-check`) and `lint` still loads the tree with GOOS=darwin. What is given up: a pull
#       request written off a Mac (the agentic loop's, a dependency bump) meets macOS at the next `make push`
#       rather than before its merge, and the byte-identical cross-host build is asserted when a release is cut
#       (checksums-check rule (c) on the release commit, release.yml's guard on the tag: both rebuild on Linux
#       what `make release` pinned) rather than on every push. Bringing either job back is the owner's decision.
#
# Each Linux job's setup-go names a DIFFERENT `cache-dependency-path` set, on purpose. setup-go derives its
# cache key from the runner and the hash of those files and nothing else, and a key is written once: the first
# job to finish saves, every later save is refused. Jobs that run side by side on one key would leave the Go
# build cache of whichever finished first -- `lint`'s, without one -race object, for `fast` to restore until the
# next dependency bump. So each job adds a file of its own to go.sum (`fast` tools.sum, `lint` .golangci.yml
# as well, `supabase` supabase/config.toml, `e2e` scripts/proof.sh): the file is the job's, the key is its own.
#
# The master ruleset (`master-pr-checks`) names the required checks by JOB NAME: fast, lint, supabase and e2e.
# A job added here is not required until the ruleset names it, and a required name no job reports blocks every
# pull request: change the two together (scripts/ci/README.md, "Required GitHub configuration"). `server`, the
# Rust workspace's job (work item 89), runs beside the others and is deliberately NOT required until the first
# server release: its comment says so.
#
# The earlier departures are gone. Each was a step disabled by a constant-false `if:` until its deliverable
# existed: P1-8 removed (b) (the `fast` job ran `make cross` in place of `make checksums-check`) and (c)
# (`make plugin-check`), both because scripts/ci/*.sh did not exist yet; P2-1 removed (a) (the whole
# `supabase` job, until the migrations existed); P2-11 removed the gates on `make test-integration` and on
# the coverage summary that depends on it; P4-1 removed the LAST one, on the `make e2e` step, by landing
# scripts/proof.sh. No constant-false gate remains anywhere in this file, so every step runs
# on every push and a green conclusion means every step passed. Do not reintroduce one: gate on a real
# condition or do not add the step.
#
# Every job below sets `timeout-minutes`, because GitHub's default is 360: a hung job burns six hours of the
# concurrency group before anyone notices. The convention and its measured reason are the house's
# (thinktech-web/.github/workflows/ci.yml:24-26 -- "Every job sets `timeout-minutes` well above its p90 because
# the default is 360 min: six e2e jobs hung in the Playwright install step for six hours each in August 2026").
# The rule: twice the p90 of TEN real green runs, rounded up, the comment naming the slowest of the ten.
# Re-measure with `gh run list --workflow ci.yml --json databaseId` and `gh run view <id> --json jobs` before
# tightening one: a bound under a job's real p90 turns a green matrix red for no reason. The bounds on `fast`,
# `supabase` and `e2e` are the ones the longer jobs of the earlier shape carried, so each is LOOSE here rather
# than wrong: leave each one alone until ten runs of this shape give it a p90. Its first four (run 42890494351,
# attempts 1 to 4, 2026-11-10, the first on cold caches for `lint`, `supabase` and `e2e`): the run 3m47s to
# 4m19s; `fast` 2m38s to 3m42s, `lint` 1m06s to 1m22s, `windows` 1m51s to 2m01s, `supabase` 3m27s to 4m08s,
# `e2e` 3m33s to 3m48s; no job waited more than 14 s for its runner.
name: ci
on:
  push: {branches: [master]}
  pull_request: {}
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  fast:                                   # no Docker: typecheck, the tests, the guards and the package checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 11                   # the earlier shape's bound (2x its 5m16s p90), with lint still in the job
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}            # P1-8's checksums-check needs tags and the release listing
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod         # 1.27.4 from the `go` line (no toolchain line, 7.2)
          cache-dependency-path: |
            go.sum
            tools.sum
      # What the IMAGE provides, printed. Four steps below depend on tools no workflow installs: `shellcheck`
      # (plugin-check.sh check 9, which DIES when CI is set), `curl` and `jq` (scripts/ci/keepalive.sh's preflight
      # -- keepalive.yml runs on the same label and has no CI coverage at all, so a missing tool there surfaces a
      # day later by e-mail), `docker` (the `supabase` and `e2e` jobs) and `gh` (checksums-check.sh rule (c),
      # release.yml's Publish step). GitHub publishes its image's contents and Blacksmith says its images carry
      # "the same dependencies supported by GitHub's official runner image" -- neither is a measurement of the
      # runner that actually ran, and CLAUDE.md's shellcheck sentence rests on a version this repository has never
      # printed (inferred from SC2317 vs SC2329 on run 33753678522, on the old GitHub-hosted runner). So print it.
      # This step never gates: each tool's real gate is where it is used. `go version` is setup-go's toolchain,
      # not the image's.
      - name: Runner image inventory
        run: |
          {
            echo '### Runner image'
            echo '```'
            (. /etc/os-release && echo "$PRETTY_NAME $(uname -m)") || echo 'os-release: ABSENT'
            for t in shellcheck go docker jq curl gh; do
              if ! command -v "$t" >/dev/null 2>&1; then echo "$t: ABSENT"; continue; fi
              case "$t" in
                shellcheck) shellcheck --version | sed -n 's/^version: /shellcheck /p' ;;
                go)         go version ;;
                docker)     docker --version ;;
                jq)         echo "jq $(jq --version)" ;;
                curl)       curl --version | head -1 ;;
                gh)         gh --version | head -1 ;;
              esac || echo "$t: version check FAILED"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make typecheck tidy-check
      # unit + testscript + harness + conformance(fs) + conformance(rest), -race, coverage profile. `go_test_p=4`: four packages at a
      # time on this 4 vCPU runner (card 245). At the Makefile's pin of 2 the `go test` line took 193 s for 283 s
      # of package time on run 42871717045, and it was the longest thing in this file; at 4 it took 98 s to 141 s
      # for 249 s to 330 s of package time on the four attempts of run 42890494351, every package green.
      - run: make build test go_test_p=4
      - run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - run: make vuln deps-check schema-check
      # `checksums-check` depends on `cross`, so all six targets are still rebuilt with the release flags and
      # dist-cross/checksums.txt still exists for the step below. GH_TOKEN is for rule (c)'s release
      # fallback (`gh release download v$VERSION`); in the pre-release 0.0.0 state the script never reaches it.
      - run: make checksums-check         # plugin/bin pins vs a fresh cross-compile or the published release
        env: {GH_TOKEN: "${{ github.token }}"}
      # What this host built, for a reader to hold against a `make cross` of the same commit on another machine:
      # since card 245 no job compares two hosts (the header's (g)).
      - run: cat dist-cross/checksums.txt >> "$GITHUB_STEP_SUMMARY"
      # scripts/ci/plugin-check.sh then scripts/ci/no-secrets.sh: the plugin/ file allowlist, mode 100755 in
      # git for the bootstrap and 100644 for everything else, VERSION == plugin.json, no .mcp.json/mcpServers/
      # channels, exec-form hooks whose commands exist, sh/bash/zsh syntax, shellcheck (a hard failure here
      # because CI is set), and the secret scan.
      - run: make plugin-check
      - run: make launcher-check        # the committed Windows launcher plugin/bin/brigade.exe reproduces from cmd/brigade-launcher (card 133)
      - run: make muse-plugin-check     # the Muse Code package, card 88: muse/brigade/ against the same pins
      - run: make codex-plugin-check    # the Codex CLI package, card 107: codex/brigade/ and the marketplace file against the same pins
      - run: make grok-plugin-check     # Grok native monitor package and canonical release assets
      - run: make docs-check            # the documentation gate, card 110: the tree's shape, links, harness pages, the changelog section
      # The mail gateway's Edge Functions (card 48): `deno fmt --check`, `deno check` and the unit tests under
      # supabase/functions/, through the Deno the Makefile would otherwise fetch with npx (`deno ?=`).
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.6.2}
      - run: make functions-check deno=deno

  # golangci-lint for darwin, linux and windows, then once per mutant tag, and the plain gofmt check: seven
  # golangci-lint runs that share nothing with the tests, so they are a job beside `fast` rather than a minute
  # inside it (card 245; 60 s to 84 s as a step of `fast` on runs 42871717045, 42864136414 and 42854679565).
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10                   # first runs: measure, then pin at 2x the p90 like the others. Loose until
                                          # then: no run has timed this job alone, or on a cold Go build cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |        # a key of this job's own: the header says why
            go.sum
            tools.sum
            .golangci.yml
      - run: make setup-lint              # golangci-lint via install.sh into ./bin (pinned)
      - run: make lint

  # Native Windows (card 133, .context/plans/native-windows.md): the binary builds, vets and tests on a GitHub-hosted
  # Windows runner (the Blacksmith fleet has no Windows image; a public repository's GitHub-hosted minutes are free).
  # `go test` here is the suite minus the files tagged `!windows` -- the POSIX-shell fixtures, the unix signals and
  # stats, the testscript suite -- plus the Windows-only tests of the platform files (adapterkit, procutil,
  # socketpost's named pipe, the launcher). No make: the image has no GNU make, and nothing here needs one.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20                   # first runs: measure, then pin at 2x the p90 like the others
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum
      - name: Runner image inventory
        shell: pwsh
        run: |
          "OS: $([System.Environment]::OSVersion.VersionString) $env:PROCESSOR_ARCHITECTURE"
          go version
          "git: $(git --version)"
          "bash: $(& 'C:\Program Files\Git\bin\bash.exe' --version | Select-Object -First 1)"
      - name: Build, vet and test on Windows
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -shuffle=on -count=1 -timeout 15m ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Docker, first half: the database's own tests and the adapter's live tests, on a local stack this job starts
  # and no other job shares -- the fault tests stop the realtime container and restart the whole stack. In the
  # earlier shape `make supabase-start` was 27 s to 30 s of this job (the ghcr.io image pulls inside it 34 s to
  # 38 s on GitHub-hosted hardware, timed from the step logs of 33942289055 and 33941694993). This is the run's
  # LONGEST job, and the adapter's live tests are why: `go test` reported 140 s to 173 s for the one package on
  # the four attempts of run 42890494351, with a warm cache on three of them.
  supabase:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25                   # the earlier shape's bound and deliberately loose: this job pulls images
                                          # over the network
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |        # a key of this job's own: the header says why
            go.sum
            supabase/config.toml
      - uses: supabase/setup-cli@v3
        with: {version: 2.116.0}          # pinned explicitly; no lockfile exists any more to read it from
      - run: make supabase-start supabase=supabase   # `supabase ?=` in the Makefile: CI overrides the npx form with
      - run: make test-db supabase=supabase          # the setup-cli binary, so local and CI run the same recipes and
      - run: make supabase-env advisor-lints supabase=supabase   # the version is pinned in exactly one place per context
      # go test (the self-skip of testutil.RequireSupabase is lifted by BRIGADE_TEST_LIVE=1 and .env.test)
      # against the stack started above. BRIGADE_TEST_LIVE=1 and BRIGADE_TEST_DOCKER=1 both come from the
      # Makefile recipe: the first is the opt-in EVERY live test waits on, so this job is the only place in CI
      # that runs them (`fast` has no stack and no .env.test and skipped them already); the second adds the
      # fault tests that stop the realtime container and restart the whole stack. These tests run the adapter in
      # process: the target builds no bin/brigade, and there is no coverage directory to make.
      - run: make test-integration-adapter
      - if: always()
        run: make supabase-clean supabase=supabase

  # Docker, second half: the conformance suite and the no-LLM proof, each driving the BUILT bin/brigade against a
  # local stack of this job's own. Before card 245 these were the last two steps of `supabase`.
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25                   # `supabase`'s bound, for the same reason: the image pulls
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |        # a key of this job's own: the header says why
            go.sum
            scripts/proof.sh
      - uses: supabase/setup-cli@v3
        with: {version: 2.116.0}          # the same pin as the `supabase` job's
      - run: make supabase-start supabase-env supabase=supabase
      # conformance(supabase) --slow against the stack started above. The step that ran `make test-integration`
      # used to name scripts/ci/conformance-setup-supabase.sh as P2-11's landing. The
      # script exists (P2-6..P2-10 landed it) but the Makefile recipe no longer uses it: --setup was
      # dropped so the suite provisions its own teams through the BRIGADE_SUPABASE_* pair and RUNS C-28 and
      # C-40 instead of skipping them. It stays as the documented out-of-band alternative for a backend
      # whose principals are provisioned elsewhere; the reasoning is on the `test-integration-conformance` recipe
      # in the Makefile. GOCOVERDIR must EXIST before an instrumented child looks for it — Go's coverage runtime does
      # not create it, it warns on stderr and writes nothing — and `covdata percent` on a missing directory
      # is an error, so the directory is made here rather than left to whichever step happens to run.
      # BRIGADE_COVER=1 is what instruments the build: the target's `build` prerequisite reads `cover_flags`.
      - name: conformance(supabase), instrumented across the process boundary
        run: |
          mkdir -p "${{ runner.temp }}/cov"
          make test-integration-conformance
        env: {BRIGADE_COVER: "1", GOCOVERDIR: "${{ runner.temp }}/cov"}
      # BRIGADE_COVER=1 matters as much as GOCOVERDIR here: `e2e: build` rebuilds bin/brigade and
      # `cover_flags` keys off BRIGADE_COVER, so without it this step would rebuild UNINSTRUMENTED and
      # contribute nothing to the summary below. proof.sh passes GOCOVERDIR through to the top-level
      # `brigade` processes it starts; adapter CHILDREN never see it (adapterkit.ChildEnv's allow-list) and
      # warn into the harness-routed adapter log, which proof.sh deliberately does not assert empty. A
      # SIGKILLed instrumented watcher writes no coverage; that is documented and accepted (plan 2701).
      - run: make e2e                     # scripts/proof.sh, watcher in --sink mode, no LLM (D31)
        env: {BRIGADE_COVER: "1", GOCOVERDIR: "${{ runner.temp }}/cov"}
      # Coverage of bin/brigade as the conformance suite drove it; the `make e2e` step above adds its own.
      # The go test process's own coverage is not here: it is the `fast` job's cover.out profile.
      - run: go tool covdata percent -i="${{ runner.temp }}/cov" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: make supabase-clean supabase=supabase

  # The Brigade server (work item 89, .context/plans/brigade-server.md): the Rust workspace under server/, which
  # shares no code with the Go side and is outside the acceptance gate, so it has a job of its own beside the
  # others. It checks the workspace (rustfmt, clippy with warnings denied, the crate allowlist of
  # server/deny.toml), runs the server's own tests, and then runs the conformance suite through the bundled `rest`
  # adapter against a running server: on the file log, and with --slow on the Cavalry feed (the contract's
  # section 6). That is why the job sets up Go as well: bin/brigade and bin/brigade-conformance are the suite.
  # Cavalry is a git dependency pinned to one commit of a public repository, which cargo fetches.
  #
  # NOT required by the master ruleset yet: the job runs from the plan's phase 2 and becomes a required check
  # when phase 3 ships the first server release (the plan's section 10, ruling 5). Add it to the ruleset then.
  server:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15                   # first runs: measure, then pin at 2x the p90 like the others. Loose until
                                          # then: no run has timed this job, least of all on a cold cargo cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |        # a key of this job's own: the header says why
            go.sum
            server/Cargo.lock
      # The image's rustup installs the toolchain server/rust-toolchain.toml pins, clippy and rustfmt with it.
      # `rustup toolchain install` with no name reads the file on rustup 1.28 and later; an older rustup refuses
      # that and installs on `rustup show` instead. Printed, because the image's rustup is not measured yet.
      - name: Rust toolchain
        working-directory: server
        run: |
          rustup --version
          rustup toolchain install || rustup show
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: server}
      - run: make server-check
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny@0.20.2}   # the version server/deny.toml was written against
      - run: make server-deps-check
      - run: make server-test

  deploy-staging:                         # Phase 5; only when a hosted staging project exists
    if: github.ref == 'refs/heads/master' && vars.BRIGADE_STAGING == 'true'
    needs: [fast, lint, supabase, e2e]
    environment: staging
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # No observed run: `vars.BRIGADE_STAGING` has never been set, so this job has only ever been skipped. The
    # bound is therefore NOT a measured p90; it is read across from the `supabase` job's own CLI steps
    # (supabase/setup-cli 7s, and three hosted `supabase` calls) on run 33942289055, with room for a hosted
    # project's latency. Replace it with 2x the p90 of the first ten real runs once staging exists.
    timeout-minutes: 15
    env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: {version: 2.116.0}
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - run: supabase db push --dry-run && supabase db push && supabase config push --yes
