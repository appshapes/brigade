[package]
name = "brigade-log"
description = "The ordered log of a Brigade server behind one trait: a file log for tests, the Cavalry feed for real."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Cavalry feed. Cavalry runs on Linux and macOS; a build without it has the file log alone.
default = ["cavalry"]
cavalry = ["dep:cavalry", "dep:cavalry-log", "dep:nix"]

[dependencies]
# The room of the driver directory's file system, read before the driver starts.
nix = { workspace = true, optional = true }
ring.workspace = true
# Cavalry is a git dependency pinned to one commit until its first release (0.1.0). Nothing in it is frozen
# before then. A new rev has to open in place the directory the rev before it wrote: `tests/stored.rs` of
# brigade-server starts this build on the feed that the released 0.9.0 left, which was built at 620a2e29
# (work item 387), and Cavalry's own gate holds the same from that rev to its master (its work item 362). No
# command starts the feed again from a snapshot (work item 386, ADR 0016).
cavalry = { git = "https://github.com/appshapes/cavalry", rev = "d265af823b8311ed878ae1cc3643d52a58737cdc", default-features = false, optional = true }
# The catalog's reader, which `cavalry` does not re-export.
cavalry-log = { git = "https://github.com/appshapes/cavalry", rev = "d265af823b8311ed878ae1cc3643d52a58737cdc", optional = true }
