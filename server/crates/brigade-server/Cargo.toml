[package]
name = "brigade-server"
description = "A Brigade backend with no Supabase project: the REST contract over a state machine and one ordered log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Cavalry feed as the server's log. Without it the server has the file log alone, which is for tests.
default = ["cavalry"]
cavalry = ["brigade-log/cavalry"]

[dependencies]
brigade-core.workspace = true
brigade-log.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
rustls.workspace = true
